<script type="module">
import * as THREE from 'three';
import { OrbitControls }     from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }    from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }        from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass }        from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass }   from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }        from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries }   from 'three/addons/utils/BufferGeometryUtils.js';

const DATA = window.ISLAND_DATA;

/* ══════════ 1. テーマ（記事の中身から導いた5つの島） ══════════ */
const THEMES = {
  crystal:{  // #17 仕組み：数字と確率。内部構造が見える島。平板な岩盤から結晶が生え、崩れて霧になる
    label:'結晶の島', rock:[0x93a9c6,0x5c6d94,0x38446a], grass:[0x63c6dd,0x36799b],
    glow:0x6ecbff, strata:.09, lava:0, metal:.16, rough:.62,
    shape:{domeH:3.6, domeExp:1.0, noise:2.0, ridge:2.0, terrace:0, crater:0, depth:14, flat:true},
    tree:'crystal', cliff:'crystal', amb:'mistfall',
    hue:.55, spread:.42, deco:['prism','octa','blade'] },
  strata:{   // #18 歴史：70年の積み重ね。段丘と水辺、崖には大量の滝
    label:'地層の島', rock:[0xc59d69,0x8b6844,0x55412d], grass:[0xa2b56d,0x617c46],
    glow:0xffd36b, strata:.36, lava:0, metal:.02, rough:.96,
    shape:{domeH:7.4, domeExp:.85, noise:4.4, ridge:2.0, terrace:2.4, crater:0, depth:52, flat:false},
    tree:'ancient', cliff:'water', amb:'none',
    hue:.22, spread:.30, deco:['mush','tuft','pond'] },
  volcano:{  // #19 物語：マグマ・火柱・メテオ。崖からはマグマが流れ落ちて霧散する
    label:'火の島', rock:[0x6d4c49,0x3b2931,0x1d1521], grass:[0x7d4c3b,0x422820],
    glow:0xff7a3c, strata:.12, lava:1, metal:.05, rough:.90,
    shape:{domeH:9.4, domeExp:1.30, noise:4.8, ridge:4.2, terrace:0, crater:7.0, depth:54, flat:false},
    tree:'charred', cliff:'magma', amb:'meteor',
    hue:.045, spread:.10, deco:['pillar','ember','obsidian'] },
  metal:{    // #20 現在地：鉱石が空へ吸い上げられ、上の大陸に取り込まれていく
    label:'鉱石の島', rock:[0x9ca5af,0x5e6772,0x343a40], grass:[0x6f8c7c,0x3d5749],
    glow:0x5fe0a6, strata:.18, lava:0, metal:.58, rough:.40,
    shape:{domeH:6.4, domeExp:1.00, noise:3.8, ridge:4.6, terrace:0, crater:0, depth:44, flat:false},
    tree:'metal', cliff:'ore', amb:'rise',
    hue:.36, spread:.55, deco:['ore','ingot','gem'] },
  storm:{    // #21 これから：信号と電気が行き交う平板な島。雷が島を巡り天へ伸びる
    label:'雷の島', rock:[0x7f89ab,0x49506f,0x262b43], grass:[0x717fa8,0x40496b],
    glow:0xd7c4ff, strata:.14, lava:0, metal:.14, rough:.78,
    shape:{domeH:3.0, domeExp:1.0, noise:1.8, ridge:1.8, terrace:0, crater:0, depth:13, flat:true},
    tree:'wind', cliff:'energy', amb:'bolt',
    hue:.72, spread:.34, deco:['spin','spire','orb'] },
};
/* 小見出しごとの色。島の基調色から少しずつずらして、場所が変われば色も変わるようにする */
const secHue=(th,k)=>(th.hue + (k*.37 % 1)*th.spread + (k%2?.02:-.02) + 1) % 1;

/* ══════════ 2. ノイズ ══════════ */
const F=Math.floor, S=Math.sin;
function hash(x,y,z){ const n=S(x*127.1+y*311.7+z*74.7)*43758.5453123; return n-F(n); }
function vnoise(x,y,z){
  const ix=F(x),iy=F(y),iz=F(z),fx=x-ix,fy=y-iy,fz=z-iz;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy),uz=fz*fz*(3-2*fz);
  const L=(a,b,t)=>a+(b-a)*t, c=(dx,dy,dz)=>hash(ix+dx,iy+dy,iz+dz);
  return L(L(L(c(0,0,0),c(1,0,0),ux),L(c(0,1,0),c(1,1,0),ux),uy),
           L(L(c(0,0,1),c(1,0,1),ux),L(c(0,1,1),c(1,1,1),ux),uy),uz)*2-1;
}
function fbm(x,y,z,o=5){ let a=0,w=.5,f=1; for(let i=0;i<o;i++){a+=w*vnoise(x*f,y*f,z*f);f*=2.03;w*=.5;} return a; }
function ridged(x,y,z,o=4){ let a=0,w=.5,f=1; for(let i=0;i<o;i++){a+=w*(1-Math.abs(vnoise(x*f,y*f,z*f)));f*=2.11;w*=.5;} return a; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function sstep(e0,e1,x){ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }

/* ══════════ 3. 島の形（テーマと種で作り分ける） ══════════ */
/* 地形そのものを彫る。プリミティブを地面に置くと「乗っている」ように見えるので、
   火山も崖も沼も穴も、高さ場を変形して作る。こうすると岩マテリアルもAOもそのまま乗る。 */
function featureDelta(F,x,z){
  let d=0;
  for(let i=0;i<F.length;i++){
    const o=F[i], dx=x-o.x, dz=z-o.z, dist=Math.sqrt(dx*dx+dz*dz);
    if(o.t==='volcano'){
      if(dist<o.r){
        const q=1-dist/o.r;
        d += o.h*q*q*(1+.10*Math.sin(Math.atan2(dz,dx)*7));   // 稜線を刻む
        if(dist<o.cr) d -= o.cd*Math.pow(1-dist/o.cr,.65);     // 火口
      }
    } else if(o.t==='mesa'){
      d += o.h*sstep(o.r+o.edge, o.r, dist);                   // 切り立った台地
    } else if(o.t==='basin'){
      if(dist<o.r) d -= o.d*Math.pow(1-dist/o.r,1.6);
    } else if(o.t==='pit'){
      if(dist<o.r) d -= o.d*sstep(o.r, o.r*.5, dist);
    }
  }
  return d;
}
/* 谷を「単調に下る谷底」へ向けて彫る。相対的に掘るだけだと地形の起伏が残り、
   川が坂を登ってしまうため、目標高さへ寄せる方式にする。 */
function channelCarve(c,x,z,y){
  const pts=c.pts;
  if(!c._len){
    let L=0; c._len=[0];
    for(let i=1;i<pts.length;i++){
      L+=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); c._len.push(L);
    }
    c._total=L||1;
  }
  let best=Infinity, bestT=0;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1], vx=b[0]-a[0], vz=b[1]-a[1], L2=vx*vx+vz*vz;
    const t=L2?Math.max(0,Math.min(1,((x-a[0])*vx+(z-a[1])*vz)/L2)):0;
    const dd=Math.hypot(x-(a[0]+vx*t), z-(a[1]+vz*t));
    if(dd<best){ best=dd; bestT=(c._len[i]+t*Math.sqrt(L2))/c._total; }
  }
  if(best>=c.w) return y;
  const target=c.y0+(c.y1-c.y0)*bestT;            // 始点から終点へ単調に下る
  const w=Math.pow(1-best/c.w,1.5);
  return y*(1-w) + Math.min(y,target)*w;          // 掘るだけ。持ち上げない
}

const R_ISLE = 25, DEPTH = 50;
function makeShape(seed, sp, R=R_ISLE){
  const s = seed*37.13 + 4.7;                       // 島ごとに違う地形になる種
  const sc = R/R_ISLE;                              // 大陸では起伏も同じ比率で拡大する
  const WX=(x,z,a)=>x + fbm(x*.028/sc+s, 3.1, z*.028/sc, 3)*a*sc;
  const WZ=(x,z,a)=>z + fbm(x*.028/sc, 8.4, z*.028/sc+s, 3)*a*sc;

  function rimR(th){
    const cx=Math.cos(th)+s, sz=Math.sin(th)+s;
    return R*(1 + .14*fbm(cx*1.6,9.3,sz*1.6,3) + .07*fbm(cx*4.1,2.7,sz*4.1,3)
                + .035*fbm(cx*9.4,6.2,sz*9.4,2));
  }
  function topY(x,z,u){
    const wx=WX(x,z,9), wz=WZ(x,z,9);
    let dome = sp.domeH * Math.pow(Math.max(0,1-u*u), sp.domeExp);
    if(sp.crater) dome -= sp.crater * Math.exp(-Math.pow(u/0.34,2));   // 火口
    if(sp.peak)   dome += sp.peak   * Math.exp(-Math.pow(u/(sp.peakW||.22),2));  // 山頂
    let n = (fbm(wx*.055/sc+s,5.2,wz*.055/sc,5)*sp.noise
          + (ridged(wx*.115/sc,1.1+s,wz*.115/sc,3)-.55)*sp.ridge)*sc
          + fbm(x*.42/sc,7.7+s,z*.42/sc,3)*.55*sc;
    let y = 1.7 + dome + n*sstep(1.0,.70,u)*.95;
    if(sp.terrace){ const t=sp.terrace; y = Math.round(y/t)*t + (y - Math.round(y/t)*t)*.32; }
    if(sp.feat) y += featureDelta(sp.feat, x, z);
    if(sp.chan) for(let i=0;i<sp.chan.length;i++) y = channelCarve(sp.chan[i], x, z, y);
    return y;
  }
  function botY(x,z,u){
    const wx=WX(x,z,15), wz=WZ(x,z,15);
    const D = (sp.depth || DEPTH)*sc;
    if(sp.flat){
      // 平板な岩盤：厚みがほぼ一定で、縁だけ薄くなる
      const slab = -D*(.42 + .58*Math.pow(Math.max(0,1-Math.pow(u,2.6)),.45));
      const n = fbm(wx*.07+s,-3.7,wz*.07,4)*2.4*(1-u*.45)
              + (ridged(wx*.16,4.4+s,wz*.16,3)-.5)*2.0*(1-u*.6);
      return -3.4 + slab + n;
    }
    const spire = -D*Math.pow(Math.max(0,1-Math.pow(u,1.5)),.62);
    const ridge = (ridged(wx*.055,7.1+s,wz*.055,4)-.5)*11*(1-u*.55);
    const n = fbm(wx*.05+s,-3.7,wz*.05,5)*5.6*(1-u*.3)
            + fbm(wx*.14,2.2,wz*.14,4)*2.1 + fbm(x*.40,1.3+s,z*.40,3)*.55;
    return -4.6 + spire + n + ridge;
  }
  const uAt=(x,z)=>clamp(Math.hypot(x,z)/rimR(Math.atan2(z,x)),0,1);
  const surfaceY=(x,z)=>topY(x,z,uAt(x,z));

  // 環境遮蔽を粗いグリッドに焼く（実行時コスト0）
  const N=72, span=R*1.3, g=new Float32Array(N*N), SM=5, RD=7.5*sc;
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    const x=(i/(N-1)*2-1)*span, z=(j/(N-1)*2-1)*span, y=surfaceY(x,z);
    let occ=0;
    for(let k=0;k<SM;k++){
      const a=k/SM*Math.PI*2+.4, px=x+Math.cos(a)*RD, pz=z+Math.sin(a)*RD;
      occ += clamp((surfaceY(px,pz)-y)/RD,0,1);
    }
    g[j*N+i] = 1-(occ/SM)*.92;
  }
  function aoAt(x,z){
    const fx=clamp((x/span*.5+.5)*(N-1),0,N-1.001), fz=clamp((z/span*.5+.5)*(N-1),0,N-1.001);
    const i=F(fx), j=F(fz), tx=fx-i, tz=fz-j;
    const a=g[j*N+i],b=g[j*N+i+1],c=g[(j+1)*N+i],d=g[(j+1)*N+i+1];
    return (a*(1-tx)+b*tx)*(1-tz)+(c*(1-tx)+d*tx)*tz;
  }
  return {rimR, topY, botY, uAt, surfaceY, aoAt};
}

/* ══════════ 4. 岩マテリアル（手続き型ディテール。テーマで色と発光を変える） ══════════ */
const ROCK_GLSL = `
float h31(vec3 p){ p=fract(p*vec3(0.1031,0.1030,0.0973)); p+=dot(p,p.yxz+33.33); return fract((p.x+p.y)*p.z); }
float vn3(vec3 p){ vec3 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);
  float a=h31(i),b=h31(i+vec3(1,0,0)),c=h31(i+vec3(0,1,0)),d=h31(i+vec3(1,1,0));
  float e=h31(i+vec3(0,0,1)),g=h31(i+vec3(1,0,1)),k=h31(i+vec3(0,1,1)),m=h31(i+vec3(1,1,1));
  return mix(mix(mix(a,b,u.x),mix(c,d,u.x),u.y),mix(mix(e,g,u.x),mix(k,m,u.x),u.y),u.z); }
float fbm3(vec3 p){ float a=0.0,w=0.5; for(int i=0;i<3;i++){ a+=w*vn3(p); p*=2.07; w*=0.5; } return a; }
float rdg3(vec3 p){ float a=0.0,w=0.5; for(int i=0;i<3;i++){ a+=w*(1.0-abs(vn3(p)*2.0-1.0)); p*=2.13; w*=0.5; } return a; }
float rockH(vec3 p){ return fbm3(p*0.30)*1.00 + rdg3(p*0.95)*0.60 + fbm3(p*3.40)*0.18; }`;

function makeRockMat(th){
  const m = new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:th.rough, metalness:th.metal*0.35,
    side:THREE.DoubleSide, envMapIntensity:.55 });
  m.extensions = { derivatives:true };
  m.onBeforeCompile = (sh)=>{
    sh.uniforms.uBump   = { value:.85 };
    sh.uniforms.uStrata = { value:th.strata };
    sh.uniforms.uLava   = { value:th.lava };
    sh.uniforms.uMetal  = { value:th.metal };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWP;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>\n  vWP=(modelMatrix*vec4(transformed,1.0)).xyz;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWP;\nuniform float uBump,uStrata,uLava,uMetal;\n${ROCK_GLSL}`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float rkH = rockH(vWP);
        float rkLo = fbm3(vWP*0.14);
        diffuseColor.rgb *= 0.64 + 0.46*rkLo + 0.30*rkH;
        float band = sin(vWP.y*0.62 + rkLo*9.0);
        diffuseColor.rgb *= 1.0 + uStrata*band;`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor *= 0.80 + 0.32*rkLo;`)
      .replace('#include <metalnessmap_fragment>', `#include <metalnessmap_fragment>
        metalnessFactor = mix(metalnessFactor, 1.0, uMetal*smoothstep(0.55,0.85,rkH));`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        if(uLava > 0.5){
          float vein = smoothstep(0.60,0.80,rkLo) * smoothstep(0.34,0.10,rkH);
          totalEmissiveRadiance += vec3(1.0,0.30,0.06)*vein*2.2;
        }`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        { vec3 dpx=dFdx(vWP), dpy=dFdy(vWP);
          float dhx=dFdx(rkH), dhy=dFdy(rkH);
          vec3 r1=cross(dpy,normal), r2=cross(normal,dpx);
          float det=dot(dpx,r1);
          vec3 gr=(r1*dhx+r2*dhy)/(abs(det)<1e-7?1e-7:det);
          normal=normalize(normal-gr*uBump); }`);
  };
  return m;
}

/* ══════════ 5. 木（テーマごとに5種） ══════════ */
function tint(g,hex){
  const c=new THREE.Color(hex), n=g.attributes.position.count, a=new Float32Array(n*3);
  for(let i=0;i<n;i++){ a[i*3]=c.r; a[i*3+1]=c.g; a[i*3+2]=c.b; }
  g.setAttribute('color', new THREE.Float32BufferAttribute(a,3)); return g;
}
function put(geo,{x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1}={}){
  const g=geo.clone();
  const m=new THREE.Matrix4()
    .multiplyMatrices(new THREE.Matrix4().makeTranslation(x,y,z), new THREE.Matrix4().makeRotationY(ry))
    .multiply(new THREE.Matrix4().makeRotationZ(rz))
    .multiply(new THREE.Matrix4().makeRotationX(rx))
    .multiply(new THREE.Matrix4().makeScale(s,s,s));
  return g.applyMatrix4(m);
}
function bendTrunk(g,H,amt){
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const t=p.getY(i)/H; p.setX(i,p.getX(i)+t*t*amt); }
  g.computeVertexNormals(); return g;
}
function droop(g,L,amt){
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const y=p.getY(i),t=y/L; p.setY(i, y-t*t*L*amt); }
  g.computeVertexNormals(); return g;
}
function buildTree(kind, th){
  const parts=[], dark=0x2b2333;
  if(kind==='crystal'){                       // 結晶樹：角ばった柱が束になって伸びる
    for(let i=0;i<7;i++){
      const a=i/7*Math.PI*2, h=1.4+ (i%3)*.85, r=.10+(i%2)*.05;
      const pr=new THREE.CylinderGeometry(r*.35, r, h, 5);
      pr.translate(0,h/2,0);
      parts.push(tint(put(pr,{x:Math.cos(a)*.28, z:Math.sin(a)*.28, rx:.16, ry:a, rz:(i%2?.1:-.1)}),
        i%3===0 ? th.glow : 0x3d5f86));
    }
  } else if(kind==='ancient'){                 // 古木：太い幹に平たい樹冠
    const H=2.6, tr=bendTrunk(new THREE.CylinderGeometry(.14,.34,H,7,4),H,.30);
    tr.translate(0,H/2,0); parts.push(tint(tr,0x4a3a2b));
    for(let i=0;i<4;i++){
      const c=new THREE.IcosahedronGeometry(.95,0); c.scale(1,.42,1);
      parts.push(tint(put(c,{x:(i%2?.5:-.45), y:H+.35+(i>1?.5:0), z:(i<2?.4:-.4), s:.72+(i%2)*.3}),
        i%2 ? 0x6d8a48 : 0x4e6b39));
    }
  } else if(kind==='charred'){                 // 焼け木：葉のない枝だけ
    const H=3.0, tr=bendTrunk(new THREE.CylinderGeometry(.05,.20,H,6,4),H,.42);
    tr.translate(0,H/2,0); parts.push(tint(tr,0x241a1c));
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2, L=.9+(i%3)*.45;
      const br=new THREE.CylinderGeometry(.02,.07,L,4); br.translate(0,L/2,0);
      parts.push(tint(put(br,{y:H*(.55+.12*(i%3)), ry:a, rx:.85+(i%2)*.25}), 0x1b1418));
    }
  } else if(kind==='metal'){                   // 金属樹：直立した幹に角板
    const H=2.9, tr=new THREE.CylinderGeometry(.07,.15,H,6); tr.translate(0,H/2,0);
    parts.push(tint(tr,0x3c444d));
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2, w=.55+(i%2)*.3;
      const pl=new THREE.BoxGeometry(w,.05,w*.55);
      parts.push(tint(put(pl,{x:Math.cos(a)*.42, y:H*(.5+.14*i)*.9, z:Math.sin(a)*.42, ry:a, rz:.22}),
        i%2 ? 0x86929e : 0x5c6a76));
    }
  } else {                                     // wind：風下へなびく木
    const H=3.2, tr=bendTrunk(new THREE.CylinderGeometry(.045,.17,H,6,5),H,.85);
    tr.translate(0,H/2,0); parts.push(tint(tr,dark));
    const L=1.7, fr=droop(new THREE.ConeGeometry(.09,L,4,4,true),L,.30); fr.translate(0,L/2,0);
    for(let i=0;i<7;i++){
      const a=i/7*Math.PI*2+.3;
      parts.push(tint(put(fr,{x:.85, y:H, ry:a, rx:1.15, rz:.55}), i%3===0?0x3f7a5e:0x2f5f4c));
    }
  }
  // Icosahedron 系はインデックス無し、Cylinder 系は有り。混ぜると merge が失敗するので揃える
  return mergeGeometries(parts.map(g=>g.index ? g.toNonIndexed() : g), false);
}

/* 流れる粒（霧・上昇する鉱石・メテオ）。t を 0→1 で往復させ、両端で消える */
function makeFlow(n, hex, o){
  const pos=new Float32Array(n*3), ph=new Float32Array(n), sz=new Float32Array(n);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, rr=(o.rIn||0)+Math.sqrt(Math.random())*(o.r-(o.rIn||0));
    pos[i*3]=Math.cos(a)*rr; pos[i*3+1]=0; pos[i*3+2]=Math.sin(a)*rr;
    ph[i]=Math.random(); sz[i]=(o.size||1)*(.45+Math.random()*1.2);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aPhase',new THREE.BufferAttribute(ph,1));
  g.setAttribute('aSize',new THREE.BufferAttribute(sz,1));
  return new THREE.Points(g,new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false,
    uniforms:{uT:{value:0},uTex:{value:SPRITE},uPix:{value:renderer.getPixelRatio()},
      uC:{value:new THREE.Color(hex)},uY0:{value:o.y0},uY1:{value:o.y1},
      uSpd:{value:o.speed||.16},uDX:{value:o.dx||0},uDZ:{value:o.dz||0},uOp:{value:o.op||.7}},
    vertexShader:`
      attribute float aPhase,aSize; varying float vA;
      uniform float uT,uPix,uY0,uY1,uSpd,uDX,uDZ;
      void main(){
        float t=fract(uT*uSpd+aPhase);
        vec3 p=position;
        p.y = mix(uY0,uY1,t);
        p.x += uDX*t + sin((t+aPhase)*6.2831)*1.6;
        p.z += uDZ*t + cos((t+aPhase)*5.1)*1.6;
        vA = sin(t*3.14159);
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_PointSize = aSize*150.0*uPix/max(-mv.z,1.0);
        gl_Position = projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying float vA; uniform sampler2D uTex; uniform vec3 uC; uniform float uOp;
      void main(){ vec4 t=texture2D(uTex,gl_PointCoord); gl_FragColor=vec4(uC, t.a*vA*uOp); }`
  }));
}
/* 崖を流れ落ちるもの（水・マグマ）。上で濃く、落ちるほど霧に散る */
function fallCurtain(w,h,cTop,cBot,spd,amp=.34){
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    blending:THREE.AdditiveBlending, fog:false,
    uniforms:{uT:{value:0},uA:{value:new THREE.Color(cTop)},uB:{value:new THREE.Color(cBot)},
              uS:{value:spd},uAmp:{value:amp}},
    vertexShader:`varying vec2 vU; void main(){ vU=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);} `,
    fragmentShader:`
      varying vec2 vU; uniform float uT,uS,uAmp; uniform vec3 uA,uB;
      float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
      float n(vec2 p){ vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
        return mix(mix(h(i),h(i+vec2(1,0)),u.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y); }
      void main(){
        vec2 p=vec2(vU.x*16.0, vU.y*3.2 + uT*uS);
        float f=n(p)*0.55+n(p*2.1)*0.28+n(vec2(vU.x*30.0,vU.y*6.0+uT*uS*1.7))*0.17;
        float body=smoothstep(0.34,0.78,f);
        float side=smoothstep(0.0,0.26,vU.x)*smoothstep(1.0,0.74,vU.x);
        float fall=smoothstep(0.0,0.58,vU.y)*smoothstep(1.0,0.93,vU.y);
        gl_FragColor=vec4(mix(uB,uA,smoothstep(0.35,1.0,vU.y)), body*side*fall*uAmp);
      }`
  }));
}

/* 島から大陸へ立ち上るもの。島の性質そのものが昇る形にする（色違いの筒にしない）
   結晶＝きらめく結晶の粒の川／地層＝風に舞う木の葉／火＝プロミネンス／
   鉱石＝せり上がる宝石と貴金属／雷＝そのまま放電して昇る大きな雷 */
/* 木の葉：先の尖った輪郭を作り、軽く反らせる（角錐では葉に見えない） */
function leafGeo(){
  const s=new THREE.Shape();
  s.moveTo(0,-1.0);
  s.bezierCurveTo(.62,-.45, .52,.55, 0,1.15);
  s.bezierCurveTo(-.52,.55, -.62,-.45, 0,-1.0);
  const g=new THREE.ShapeGeometry(s, 14);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const yy=p.getY(i), xx=p.getX(i);
    p.setZ(i, (1-yy*yy*.7)*.20 + xx*xx*.35);      // 縦に反り、横に丸める
  }
  g.computeVertexNormals(); g.scale(.85,.85,.85); return g;
}
const RISERS=[];
function makeRiser(kind, x, z, y0, h, hex){
  if(kind==='flame'){
    const pts=[];
    for(let i=0;i<=12;i++){ const q=i/12;
      pts.push(new THREE.Vector3(
        x + Math.sin(q*Math.PI)*18 + Math.sin(q*7)*2.6,
        y0 + h*q,
        z + Math.sin(q*Math.PI)*10)); }
    const tube=new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),90,3.4,10,false),
      new THREE.ShaderMaterial({ transparent:true, depthWrite:false, side:THREE.DoubleSide,
        blending:THREE.AdditiveBlending, fog:false, uniforms:{uT:{value:0}},
        vertexShader:`varying vec2 vU; void main(){ vU=uv;
          gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);} `,
        fragmentShader:`
          varying vec2 vU; uniform float uT;
          float h1(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
          float n1(vec2 p){ vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
            return mix(mix(h1(i),h1(i+vec2(1,0)),u.x),mix(h1(i+vec2(0,1)),h1(i+vec2(1,1)),u.x),u.y); }
          void main(){
            // 炎は縦に伸びて千切れる。横に細かく、縦に引き伸ばした乱流を重ねる
            vec2 p =vec2(vU.x*11.0, vU.y*3.2 - uT*0.85);
            vec2 p2=vec2(vU.x*22.0, vU.y*6.4 - uT*1.55);
            vec2 p3=vec2(vU.x*5.0,  vU.y*1.6 - uT*0.42);
            float f=n1(p3)*0.42+n1(p)*0.36+n1(p2)*0.22;
            float body=smoothstep(0.30,0.72,f);
            float core=smoothstep(0.52,0.86,f);
            float ring=smoothstep(0.0,0.34,vU.x)*smoothstep(1.0,0.66,vU.x);
            float life=smoothstep(0.0,0.07,vU.y)*smoothstep(1.0,0.48,vU.y);
            float flick=0.86+0.14*sin(uT*7.0+vU.y*9.0);
            vec3 c=mix(vec3(1.0,0.22,0.03), vec3(1.0,0.72,0.24), body);
            c=mix(c, vec3(1.0,0.96,0.80), core);
            gl_FragColor=vec4(c*(0.7+body*1.9)*flick, (body*0.55+core*0.45)*ring*life*0.50);
          }`}));
    scene.add(tube); RISERS.push({kind:'flame', tube});
    const em=makeFlow(LOW?80:200, 0xff8a3a, {r:16, y0:0, y1:h, speed:.055, size:2.0, op:.6});
    em.position.set(x,y0,z); scene.add(em); RISERS.push({kind:'flow', o:em});
    return;
  }
  if(kind==='bolt'){
    const NB=LOW?2:4, SEG=16, pos=new Float32Array(NB*SEG*2*3);
    const g=new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const lines=new THREE.LineSegments(g, new THREE.LineBasicMaterial({
      color:hex, transparent:true, opacity:.9, blending:THREE.AdditiveBlending, depthWrite:false}));
    lines.frustumCulled=false; scene.add(lines);
    RISERS.push({kind:'bolt', lines, pos, NB, SEG, x, z, y0, h, next:0});
    const gl=makeFlow(LOW?50:140, hex, {r:10, y0:0, y1:h, speed:.10, size:1.2, op:.45});
    gl.position.set(x,y0,z); scene.add(gl); RISERS.push({kind:'flow', o:gl});
    return;
  }
  const N=LOW?70:180;
  const geo = kind==='leaf' ? leafGeo()
            : kind==='gem'  ? new THREE.OctahedronGeometry(.68,0)
            :                 new THREE.CylinderGeometry(.11,.28,1.8,5);
  const im=new THREE.InstancedMesh(geo,
    decoMat(kind==='leaf'?.28:.95, kind==='gem'?.74:.26, kind==='gem'?.13:.30), N);
  const list=[], col=new THREE.Color();
  for(let i=0;i<N;i++){
    list.push({a:Math.random()*6.283, rr:2+Math.sqrt(Math.random())*13, ph:Math.random(),
      sp:.028+Math.random()*.045, s:.5+Math.random()*1.2,
      sx:(Math.random()-.5)*2.4, sy:(Math.random()-.5)*2.4, sw:.35+Math.random()*.95});
    if(kind==='leaf')      col.setHSL(.09+Math.random()*.17,.56,.40+Math.random()*.22);
    else if(kind==='gem')  col.setHSL(Math.random(),.62,.54+Math.random()*.22);
    else                   col.setHSL(.51+Math.random()*.11,.52,.60+Math.random()*.26);
    im.setColorAt(i,col);
  }
  if(im.instanceColor) im.instanceColor.needsUpdate=true;
  scene.add(im);
  RISERS.push({kind:'grain', im, list, x, z, y0, h});
}
function updateRiseBolt(r,t){
  r.lines.material.opacity = .25 + Math.random()*.65;
  if(t < r.next) return;
  r.next = t + .10 + Math.random()*.22;
  const {pos,NB,SEG,x,z,y0,h}=r;
  let o=0;
  for(let b=0;b<NB;b++){
    const sway=(Math.random()-.5)*14;
    let px=x+(Math.random()-.5)*6, py=y0, pz=z+(Math.random()-.5)*6;
    for(let s=1;s<=SEG;s++){
      const q=s/SEG;
      const qx=x+sway*q+(Math.random()-.5)*9;
      const qy=y0+h*q;
      const qz=z+sway*q*.6+(Math.random()-.5)*9;
      pos[o++]=px; pos[o++]=py; pos[o++]=pz;
      pos[o++]=qx; pos[o++]=qy; pos[o++]=qz;
      px=qx; py=qy; pz=qz;
    }
  }
  r.lines.geometry.attributes.position.needsUpdate=true;
}

const NT=LOW?96:150, NU=LOW?46:74;
function buildSheet(nu,nt,fn,flip){
  const pos=[],col=[],idx=[];
  for(let i=0;i<=nu;i++){ const u=i/nu;
    for(let j=0;j<=nt;j++){ const p=fn(u, j/nt*Math.PI*2);
      pos.push(p.x,p.y,p.z); col.push(p.c.r,p.c.g,p.c.b); } }
  for(let i=0;i<nu;i++) for(let j=0;j<nt;j++){
    const a=i*(nt+1)+j,b=a+1,c2=a+nt+1,d=c2+1;
    if(flip) idx.push(a,b,c2,b,d,c2); else idx.push(a,c2,b,b,c2,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

/* 地形（上面・崖・下面）。島でも大陸でも同じ手続きで作れるよう、半径を受け取る */
function buildTerrain(sh, th, mat, grp, nu, nt, R){
  const sc=R/R_ISLE;
  const cGrassLo=new THREE.Color(th.grass[1]), cGrassHi=new THREE.Color(th.grass[0]);
  const cRockHi=new THREE.Color(th.rock[0]), cRockMid=new THREE.Color(th.rock[1]), cRockLo=new THREE.Color(th.rock[2]);
  const cGlow=new THREE.Color(th.glow);

  const top=new THREE.Mesh(buildSheet(nu,nt,(u,t)=>{
    const rr=u*sh.rimR(t), x=Math.cos(t)*rr, z=Math.sin(t)*rr, y=sh.topY(x,z,u);
    const e=1.3*sc;
    const hx=sh.topY(x+e,z,sh.uAt(x+e,z))-sh.topY(x-e,z,sh.uAt(x-e,z));
    const hz=sh.topY(x,z+e,sh.uAt(x,z+e))-sh.topY(x,z-e,sh.uAt(x,z-e));
    const slope=Math.hypot(hx,hz)/(2*e);
    const wet=sstep(.86,.42,u), lush=clamp(.5+fbm(x*.09/sc,3.3,z*.09/sc,3)*.7,0,1);
    const c=cGrassLo.clone().lerp(cGrassHi,lush*wet);
    c.lerp(cRockMid, sstep(.72,1.0,u));
    c.lerp(cRockHi,  sstep(.42,1.15,slope));
    c.lerp(cGlow,    clamp(fbm(x*.22/sc,8.8,z*.22/sc,2),0,1)*.16*wet);
    c.multiplyScalar(.34+.66*sh.aoAt(x,z));
    return {x,y,z,c};
  },true), mat);
  top.receiveShadow=!LOW; top.castShadow=!LOW; grp.add(top);

  const wall=new THREE.Mesh(buildSheet(LOW?8:12,nt,(v,t)=>{
    const bulge=1+.055*fbm(Math.cos(t)*3.2,v*5.0,Math.sin(t)*3.2,3);
    const rr=sh.rimR(t)*bulge, x=Math.cos(t)*rr, z=Math.sin(t)*rr;
    const y0=sh.topY(x,z,1), y1=sh.botY(x,z,1);
    const y=y0+(y1-y0)*v+fbm(x*.2/sc,v*3.4,z*.2/sc,3)*1.15*sc;
    const c=cRockMid.clone().lerp(cRockHi,v).lerp(cRockLo,v*v*.7);
    c.lerp(cGlow, clamp(fbm(x*.3/sc,v*6.0,z*.3/sc,2),0,1)*.13);
    return {x,y,z,c};
  },false), mat);
  wall.castShadow=!LOW; grp.add(wall);

  const bot=new THREE.Mesh(buildSheet(nu,nt,(u,t)=>{
    const uu=1-u, rr=uu*sh.rimR(t), x=Math.cos(t)*rr, z=Math.sin(t)*rr, y=sh.botY(x,z,uu);
    const c=cRockHi.clone().lerp(cRockLo,sstep(.9,.25,uu)).lerp(new THREE.Color(0x0d0b14),sstep(.4,0,uu));
    c.lerp(cGlow, clamp(fbm(x*.16/sc,4.4,z*.16/sc,3),0,1)*.20*sstep(.05,.6,uu));
    return {x,y,z,c};
  },false), mat);
  bot.castShadow=!LOW; grp.add(bot);
  return {top,wall,bot};
}

const islands=[];
function buildIsland(idx){
  const d=DATA[idx], th=THEMES[d.theme], sh=makeShape(idx+1, th.shape);
  const grp=new THREE.Group();
  const mat=makeRockMat(th);
  buildTerrain(sh, th, mat, grp, NU, NT, R_ISLE);
  const cRockLo=new THREE.Color(th.rock[2]);

  // 根は「生きている島」＝地層の島だけ。他はテーマ固有のものが下面から生える
  const rootMat=new THREE.MeshStandardMaterial({color:cRockLo.clone().multiplyScalar(.75),roughness:.95});
  const NR = th.cliff==='water' ? (LOW?5:9) : 0;
  for(let i=0;i<NR;i++){
    const t=(i/NR)*Math.PI*2+Math.random()*.3, rr=sh.rimR(t)*(.42+Math.random()*.34);
    const x0=Math.cos(t)*rr, z0=Math.sin(t)*rr, len=16+Math.random()*26, pts=[];
    for(let k=0;k<=5;k++){
      const q=k/5, s2=1-q*.55;
      pts.push(new THREE.Vector3(
        x0*s2+Math.sin(q*4.2+i*2.1)*5.5*q,
        sh.botY(x0*s2,z0*s2,Math.hypot(x0*s2,z0*s2)/sh.rimR(t))-2-len*q*q,
        z0*s2+Math.cos(q*3.3+i*1.7)*5.5*q));
    }
    const tb=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),24,.55+Math.random()*.55,6,false),rootMat);
    tb.castShadow=!LOW; grp.add(tb);
  }

  // 木
  const treeGeo=buildTree(th.tree, th);
  const treeMat=new THREE.MeshStandardMaterial({vertexColors:true,
    roughness:th.tree==='crystal'?.22:.86,
    metalness:th.tree==='metal'?.62:.02, side:THREE.DoubleSide, envMapIntensity:.45,
    emissive:th.tree==='crystal'?th.glow:0x000000, emissiveIntensity:.65});
  const NTr=LOW?110:280;
  const trees=new THREE.InstancedMesh(treeGeo,treeMat,NTr);
  const dm=new THREE.Object3D(), col=new THREE.Color();
  let n=0,guard=0;
  while(n<NTr && guard++<NTr*10){
    const t=Math.random()*Math.PI*2, u=Math.sqrt(Math.random())*.88;
    const rr=u*sh.rimR(t), x=Math.cos(t)*rr, z=Math.sin(t)*rr, y=sh.surfaceY(x,z);
    const s2=.62+Math.random()*.95;
    dm.position.set(x,y,z);
    dm.rotation.set((Math.random()-.5)*.14, Math.random()*6.28, (Math.random()-.5)*.14);
    dm.scale.set(s2,s2*(.85+Math.random()*.5),s2);
    dm.updateMatrix(); trees.setMatrixAt(n,dm.matrix);
    col.setHSL(.05+Math.random()*.5,.12+Math.random()*.2,.78+Math.random()*.22);
    trees.setColorAt(n,col); n++;
  }
  trees.count=n; trees.instanceMatrix.needsUpdate=true;
  if(trees.instanceColor) trees.instanceColor.needsUpdate=true;
  trees.castShadow=!LOW; trees.userData.occluder=true; grp.add(trees);

  const fx={flows:[], curtains:[], rise:null, bolts:null, spin:null};

  // ── 見どころの位置を先に決める（景物をその周りに配るため） ──
  const spots=d.sections.map((_,k)=>{
    const t=(k/d.sections.length)*Math.PI*2+.35, u=.30+.52*((k*.37)%1);
    const rr=u*sh.rimR(t), x=Math.cos(t)*rr, z=Math.sin(t)*rr;
    return new THREE.Vector3(x, sh.surfaceY(x,z), z);
  });

  // ── 小見出しごとの景物。場所が変われば色も形も変わる ──
  th.deco.forEach((kind,vi)=>{
    const per=LOW?4:8, im=new THREE.InstancedMesh(decoGeo(kind),
      kind==='pond' ? waterMat() : decoMat(vi===0?.70:.26, .35, .3),
      spots.length*per);
    let m2=0;
    spots.forEach((sp2,k)=>{
      const hue=secHue(th,k);
      for(let j=0;j<per;j++){
        const a=Math.random()*Math.PI*2, rr=1.8+Math.random()*6.2;
        const x=sp2.x+Math.cos(a)*rr, z=sp2.z+Math.sin(a)*rr;
        if(sh.uAt(x,z)>.93) continue;
        let y=sh.surfaceY(x,z); const flat=(kind==='pond');
        const s2=(flat?.7:.5)+Math.random()*(kind==='pillar'?.85:.95);
        if(flat){
          // 水は窪地にしか溜まらない。周囲を測って、平坦なら縁が埋まる高さへ沈める
          const rad=s2*1.9; let lo=Infinity, hi=-Infinity;
          for(let q=0;q<8;q++){
            const th2=q/8*Math.PI*2;
            const yy=sh.surfaceY(x+Math.cos(th2)*rad, z+Math.sin(th2)*rad);
            if(yy<lo) lo=yy; if(yy>hi) hi=yy;
          }
          if(hi-lo > 1.1) continue;            // 傾いた場所には置かない
          y = lo - .28;                        // 周囲より低く＝岸が地面に隠れる
        }
        dm.position.set(x, y+(flat?0:s2*.42), z);
        // 水面は「Zで面内回転 → Xで倒す」。Yで振ると倒す前に向きが変わって板が立ってしまう
        if(flat) dm.rotation.set(-Math.PI/2, 0, Math.random()*6.28);
        else     dm.rotation.set((Math.random()-.5)*.42, Math.random()*6.28, (Math.random()-.5)*.42);
        dm.scale.set(s2, s2*(kind==='pillar'?1.5:(.8+Math.random()*.9)), s2);
        dm.updateMatrix(); im.setMatrixAt(m2, dm.matrix);
        if(flat) col.setHSL(.55+Math.random()*.05, .42, .40+Math.random()*.12);  // 水は水の色
        else     col.setHSL(hue, .50+Math.random()*.34, .34+Math.random()*.22);
        im.setColorAt(m2, col); m2++;
      }
    });
    im.count=m2; im.instanceMatrix.needsUpdate=true;
    if(im.instanceColor) im.instanceColor.needsUpdate=true;
    im.castShadow=!LOW && kind!=='pond'; im.userData.occluder=(kind!=='pond'); grp.add(im);
    if(kind==='spin'){                       // 雷の島：くるくる回る結晶
      const base=[];
      for(let i=0;i<m2;i++){ const mm=new THREE.Matrix4(); im.getMatrixAt(i,mm);
        const p=new THREE.Vector3(), q=new THREE.Quaternion(), s3=new THREE.Vector3();
        mm.decompose(p,q,s3); base.push({p,s:s3,ph:Math.random()*6.28}); }
      fx.spin={mesh:im, base};
    }
  });

  // ── 崖の現象 ──
  if(th.cliff==='crystal'||th.cliff==='ore'){         // 崖からも結晶／鉱石が顔を出す
    const NC=LOW?26:74, im=new THREE.InstancedMesh(decoGeo(th.cliff==='crystal'?'prism':'ore'),
      decoMat(.7,.42,.28), NC);
    for(let i=0;i<NC;i++){
      const t=Math.random()*Math.PI*2, v=.06+Math.random()*.82;
      const rr=sh.rimR(t), x=Math.cos(t)*rr, z=Math.sin(t)*rr;
      const y0=sh.topY(x,z,1), y1=sh.botY(x,z,1), s2=.55+Math.random()*1.6;
      dm.position.set(x*1.02, y0+(y1-y0)*v, z*1.02);
      dm.rotation.set((Math.random()-.5)*1.1, t, Math.PI*.5*(.55+Math.random()*.7));
      dm.scale.set(s2, s2*(1+Math.random()*1.2), s2);
      dm.updateMatrix(); im.setMatrixAt(i,dm.matrix);
      col.setHSL(secHue(th,i%spots.length), .58, .48+Math.random()*.26);
      im.setColorAt(i,col);
    }
    im.instanceMatrix.needsUpdate=true;
    if(im.instanceColor) im.instanceColor.needsUpdate=true;
    grp.add(im);
  }
  if(th.cliff==='water'||th.cliff==='magma'){         // 大量の滝／流れ落ちるマグマ
    const isW=th.cliff==='water', N2=LOW?4:9;
    for(let i=0;i<N2;i++){
      const t=(i/N2)*Math.PI*2+Math.random()*.42;
      const rr=sh.rimR(t), x=Math.cos(t)*rr, z=Math.sin(t)*rr;
      const y0=sh.topY(x,z,1), h=26+Math.random()*32;
      const m=fallCurtain(isW?5.5:7.6, h, isW?0xffffff:0xffc060, isW?0x6fa8d8:0xff3a08,
        isW?1.35:.50, isW?.34:.62);
      m.position.set(x*1.02, y0-h/2+1, z*1.02);
      m.lookAt(0,m.position.y,0); m.rotateY(Math.PI);
      grp.add(m); fx.curtains.push(m);
    }
    const mist=makeFlow(LOW?90:230, isW?0xbcd8f0:0xff6a2a,
      {r:R_ISLE*1.06, rIn:R_ISLE*.68, y0:-10, y1:-62, speed:.12, size:1.6, op:isW?.32:.5});
    grp.add(mist); fx.flows.push(mist);
  }

  // ── 下面：根のかわりに、島ごとのもの ──
  if(th.cliff==='crystal'){          // 大きな結晶が下向きに生え、その先から霧になって散る
    const NX=LOW?9:18, im=new THREE.InstancedMesh(decoGeo('blade'), decoMat(.9,.42,.2), NX);
    for(let i=0;i<NX;i++){
      const a=Math.random()*Math.PI*2, u=.16+Math.random()*.64;
      const rr=u*sh.rimR(a), x=Math.cos(a)*rr, z=Math.sin(a)*rr, y=sh.botY(x,z,u);
      const s2=1.5+Math.random()*2.4;
      dm.position.set(x, y-s2*1.5, z);
      dm.rotation.set(Math.PI+(Math.random()-.5)*.5, Math.random()*6.28, (Math.random()-.5)*.5);
      dm.scale.set(s2, s2*1.6, s2);
      dm.updateMatrix(); im.setMatrixAt(i,dm.matrix);
      col.setHSL(secHue(th,i%spots.length), .58, .48+Math.random()*.2);
      im.setColorAt(i,col);
    }
    im.instanceMatrix.needsUpdate=true;
    if(im.instanceColor) im.instanceColor.needsUpdate=true;
    grp.add(im);
  }
  if(th.cliff==='magma'){            // 炎を吹き出しながら、マグマが周囲へ広がって消える
    const jets=makeFlow(LOW?70:170, 0xffb05a,
      {r:R_ISLE*1.0, rIn:R_ISLE*.55, y0:-30, y1:-6, speed:.24, size:1.5, op:.55});
    grp.add(jets); fx.flows.push(jets);
    const spread=makeFlow(LOW?90:230, 0xff5a1e,
      {r:R_ISLE*2.0, rIn:R_ISLE*.6, y0:-34, y1:-80, speed:.09, size:2.6, op:.42});
    grp.add(spread); fx.flows.push(spread);
  }
  if(th.cliff==='ore'){              // 大きな鉱石の塊が顔を出し、エネルギーを吸って育つ
    const NX=LOW?7:15, im=new THREE.InstancedMesh(decoGeo('ore'), decoMat(.55,.6,.3), NX);
    const grow=[];
    for(let i=0;i<NX;i++){
      const a=Math.random()*Math.PI*2, u=.14+Math.random()*.62;
      const rr=u*sh.rimR(a), x=Math.cos(a)*rr, z=Math.sin(a)*rr, y=sh.botY(x,z,u);
      grow.push({p:new THREE.Vector3(x,y-1.6,z), s:2.2+Math.random()*3.0, ph:Math.random()*6.28});
      col.setHSL(secHue(th,i%spots.length), .55, .44+Math.random()*.2);
      im.setColorAt(i,col);
    }
    if(im.instanceColor) im.instanceColor.needsUpdate=true;
    grp.add(im); fx.grow={mesh:im, list:grow};
    const suck=makeFlow(LOW?90:220, th.glow,
      {r:R_ISLE*1.6, rIn:R_ISLE*.5, y0:-70, y1:-10, speed:.17, size:1.2, op:.5});
    grp.add(suck); fx.flows.push(suck);
  }
  if(th.cliff==='energy'){           // 崖下の中央に大きなクリスタル。真下の空中からエネルギーを吸う
    const cy=sh.botY(0,0,0);
    const big=new THREE.Mesh(new THREE.OctahedronGeometry(5.6,0),
      new THREE.MeshStandardMaterial({color:0x120c22, emissive:th.glow, emissiveIntensity:1.7,
        roughness:.18, metalness:.3, transparent:true, opacity:.95}));
    big.position.set(0, cy-7.5, 0); grp.add(big); fx.bigCrystal=big;
    const f=makeFlow(LOW?120:300, th.glow,
      {r:R_ISLE*.85, y0:cy-56, y1:cy-8, speed:.19, size:1.2, op:.6});
    grp.add(f); fx.flows.push(f);
  }

  // ── 島ごとの現象 ──
  if(th.amb==='mistfall'){                            // 崩れた結晶が霧になって落ちる
    const f=makeFlow(LOW?150:360, th.glow, {r:R_ISLE*1.0, y0:-16, y1:-76, speed:.10, size:1.35, op:.42});
    grp.add(f); fx.flows.push(f);
  } else if(th.amb==='rise'){                         // 小さな鉱石が空へ吸い上げられていく
    const f=makeFlow(LOW?130:300, th.glow, {r:R_ISLE*.95, y0:3, y1:86, speed:.09, size:1.0, op:.5});
    grp.add(f); fx.flows.push(f);
    const NO=LOW?16:40, im=new THREE.InstancedMesh(decoGeo('gem'), decoMat(1.0,.5,.24), NO);
    const rise=[];
    for(let i=0;i<NO;i++){
      const a=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random())*R_ISLE*.9;
      rise.push({x:Math.cos(a)*rr, z:Math.sin(a)*rr, ph:Math.random(), s:.4+Math.random()*.7,
                 sp:.045+Math.random()*.05});
      col.setHSL(secHue(th,i%spots.length),.6,.55); im.setColorAt(i,col);
    }
    if(im.instanceColor) im.instanceColor.needsUpdate=true;
    grp.add(im); fx.rise={mesh:im, list:rise};
  } else if(th.amb==='meteor'){                       // 天からのメテオ
    const f=makeFlow(LOW?40:96, 0xff9a4a,
      {r:R_ISLE*1.7, y0:130, y1:-14, speed:.055, size:2.4, dx:-30, dz:16, op:.8});
    grp.add(f); fx.flows.push(f);
  } else if(th.amb==='bolt'){                         // 信号が雷になって島を巡り、天へ伸びる
    const NB=LOW?4:7, SEG=9;
    const pos=new Float32Array(NB*SEG*2*3);
    const g2=new THREE.BufferGeometry();
    g2.setAttribute('position', new THREE.BufferAttribute(pos,3));
    const lines=new THREE.LineSegments(g2, new THREE.LineBasicMaterial({
      color:th.glow, transparent:true, opacity:.85, blending:THREE.AdditiveBlending, depthWrite:false }));
    lines.frustumCulled=false; grp.add(lines);

    fx.bolts={lines, pos, NB, SEG, next:0, spots, src:fx.bigCrystal?fx.bigCrystal.position.clone():null};
  }

  // 小見出しのマーカー
  const marks=[];
  d.sections.forEach((sec,k)=>{
    const x=spots[k].x, y=spots[k].y, z=spots[k].z;
    const g=new THREE.Group(); g.position.set(x,y,z);
    const orb=new THREE.Mesh(new THREE.SphereGeometry(.62,16,14),
      new THREE.MeshStandardMaterial({color:0x0d1a2c,emissive:th.glow,emissiveIntensity:1.5,roughness:.25}));
    orb.position.y=2.4; g.add(orb);
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:SPRITE,color:th.glow,transparent:true,
      blending:THREE.AdditiveBlending,depthWrite:false,fog:false,opacity:.45}));
    halo.position.y=2.4; halo.scale.setScalar(4.6); g.add(halo);
    const num=new THREE.Sprite(new THREE.SpriteMaterial({map:numTex(k+1),transparent:true,fog:false,
      sizeAttenuation:false,depthTest:false}));
    num.scale.set(.030,.030,1); num.position.y=2.4; num.renderOrder=13; g.add(num);
    const post=new THREE.Mesh(new THREE.CylinderGeometry(.05,.09,2.4,5),
      new THREE.MeshStandardMaterial({color:0x1a2436,roughness:.8}));
    post.position.y=1.2; g.add(post);
    const hit=new THREE.Mesh(new THREE.SphereGeometry(k===0?3.2:2.2,10,8),
      new THREE.MeshBasicMaterial({visible:false}));
    hit.position.y=2.4; hit.userData={isle:idx, sec:k}; g.add(hit);

    // 冒頭＝入口。ここから入るのだと分かるように、光の門を立てる
    let ring=null, gate=null;
    if(k===0){
      ring=new THREE.Mesh(new THREE.TorusGeometry(3.0,.16,8,40),
        new THREE.MeshStandardMaterial({color:0x0d1a2c, emissive:th.glow, emissiveIntensity:2.4,
          roughness:.25, transparent:true, opacity:.95}));
      ring.position.y=2.4; ring.rotation.x=Math.PI/2; g.add(ring);
      gate=labelSprite('▶ 入口 ここから', th.glow, .046);
      gate.position.y=6.4; g.add(gate);
      orb.scale.setScalar(1.35);
    }
    g.visible=false; grp.add(g);
    marks.push({g, orb, halo, num, hit, ring, gate, pos:new THREE.Vector3(x,y,z)});
  });

  // 島の名札（全景で見える）
  const lab=labelSprite(`${d.no}　${d.tag}`, th.glow, .058);
  lab.position.set(0, sh.topY(0,0,0)+13, 0); grp.add(lab);

  // 島の周りを漂う光
  const NM=LOW?260:620;
  const mp=new Float32Array(NM*3), mc=new Float32Array(NM*3), ms=new Float32Array(NM), mh=new Float32Array(NM);
  const c1=new THREE.Color(th.glow), c2=new THREE.Color(0xfff0c8);
  for(let i=0;i<NM;i++){
    const t=Math.random()*Math.PI*2, rr=4+Math.random()*(R_ISLE*1.05);
    const x=Math.cos(t)*rr, z=Math.sin(t)*rr;
    mp[i*3]=x; mp[i*3+1]=sh.surfaceY(x,z)+.5+Math.random()*13; mp[i*3+2]=z;
    const c=Math.random()<.72?c1:c2;
    mc[i*3]=c.r; mc[i*3+1]=c.g; mc[i*3+2]=c.b;
    ms[i]=.35+Math.random()*1.25; mh[i]=Math.random()*Math.PI*2;
  }
  const mg=new THREE.BufferGeometry();
  mg.setAttribute('position',new THREE.BufferAttribute(mp,3));
  mg.setAttribute('color',new THREE.BufferAttribute(mc,3));
  mg.setAttribute('aSize',new THREE.BufferAttribute(ms,1));
  mg.setAttribute('aPhase',new THREE.BufferAttribute(mh,1));
  const motes=new THREE.Points(mg,new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false, vertexColors:true,
    uniforms:{uT:{value:0},uTex:{value:SPRITE},uPix:{value:renderer.getPixelRatio()}},
    vertexShader:`
      attribute float aSize,aPhase; varying vec3 vC; varying float vA; uniform float uT,uPix;
      void main(){
        vC=color; vec3 p=position;
        p.y += sin(uT*0.33+aPhase)*2.2 + sin(uT*0.11+aPhase*2.7)*1.1;
        p.x += cos(uT*0.21+aPhase*1.7)*2.6;
        p.z += sin(uT*0.25+aPhase*2.3)*2.6;
        vA = 0.30+0.70*abs(sin(uT*0.75+aPhase));
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_PointSize = aSize*130.0*uPix/max(-mv.z,1.0);
        gl_Position = projectionMatrix*mv;
      }`,
    fragmentShader:`varying vec3 vC; varying float vA; uniform sampler2D uTex;
      void main(){ vec4 t=texture2D(uTex,gl_PointCoord); gl_FragColor=vec4(vC*1.05, t.a*vA*0.62); }`
  }));
  grp.add(motes);

  return {grp, marks, lab, motes, sh, th, data:d, fx, top:sh.topY(0,0,0),
          viewDist:74, secScale:1};
}

const ROAD_PTS = [[0,22],[-7,14],[6,8],[-5,2],[7,-4],[-3,-9],[0,-11]];
/* 地表を流れる溶岩の川（原典の lavaCurve） */
const LAVA_PTS = [[14.5,-18],[7,-15],[0,-13],[-8,-9],[-15,-4]];

/* 地形に沿うリボン（道・溶岩の川）。彫った谷の底をなぞる */
function terrainRibbon(curve, half, lift, segs, sh, uMax){
  const pos=[], uv=[], idx=[];
  const UM = (uMax===undefined) ? 1 : uMax;
  for(let i=0;i<=segs;i++){
    const u=(i/segs)*UM, p=curve.getPointAt(u), tg=curve.getTangentAt(u);
    let nx=-tg.z, nz=tg.x; const L=Math.hypot(nx,nz)||1; nx/=L; nz/=L;
    for(let s=-1;s<=1;s+=2){
      const x=p.x+nx*half*s, z=p.z+nz*half*s;
      pos.push(x, sh.surfaceY(x,z)+lift, z);
      uv.push(u*segs*0.02, (s+1)/2);
    }
  }
  for(let i=0;i<segs;i++){ const a=i*2; idx.push(a,a+2,a+1, a+1,a+2,a+3); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
/* 溶岩は下へしか流れない。地表をなぞりつつ、一度でも下がった高さより上へは戻さない */
function flowRibbon(curve, half, segs, sh, lift){
  const pos=[], uv=[], idx=[];
  let y=null;
  for(let i=0;i<=segs;i++){
    const u=i/segs, p=curve.getPointAt(u), tg=curve.getTangentAt(u);
    let nx=-tg.z, nz=tg.x; const L=Math.hypot(nx,nz)||1; nx/=L; nz/=L;
    const gy=sh.surfaceY(p.x,p.z)+(lift||1.0);
    y = (y===null) ? gy : Math.min(y - 0.05, gy);     // 単調に下る
    for(let s=-1;s<=1;s+=2){
      pos.push(p.x+nx*half*s, y, p.z+nz*half*s);
      uv.push(u*segs*0.02, (s+1)/2);
    }
  }
  for(let i=0;i<segs;i++){ const a=i*2; idx.push(a,a+2,a+1, a+1,a+2,a+3); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
/* 流れる溶岩：黒い外皮が割れて、その裂け目から高温が覗く */
function lavaFlowMat(){
  return new THREE.ShaderMaterial({ side:THREE.DoubleSide,
    uniforms:{uT:{value:0}, fogColor:{value:scene.fog.color}},
    vertexShader:`varying vec2 vU; varying float vFog;
      void main(){ vU=uv; vec4 mv=modelViewMatrix*vec4(position,1.0);
        vFog=1.0-exp(-pow(length(mv.xyz)*0.00075,2.0));
        gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`
      varying vec2 vU; varying float vFog; uniform float uT; uniform vec3 fogColor;
      float h1(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float n1(vec2 p){ vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
        return mix(mix(h1(i),h1(i+vec2(1,0)),u.x),mix(h1(i+vec2(0,1)),h1(i+vec2(1,1)),u.x),u.y); }
      float fb(vec2 p){ float s=0.,a=.5; for(int i=0;i<5;i++){ s+=a*n1(p); p*=2.07; a*=.5; } return s; }
      void main(){
        vec2 p  = vec2(vU.x*2.4 - uT*0.16, vU.y*2.6);
        float f = fb(p), f2 = fb(p*2.9+7.0);
        float crust = smoothstep(0.38, 0.66, f*0.65 + f2*0.35);
        vec3 hot   = mix(vec3(1.0,0.94,0.60), vec3(1.0,0.32,0.04), smoothstep(0.0,0.6,crust));
        vec3 shell = mix(vec3(0.19,0.085,0.065), vec3(0.05,0.03,0.03), f2);
        vec3 c = mix(hot*2.0, shell, smoothstep(0.28, 0.76, crust));
        float edge = smoothstep(0.0,0.18,vU.y)*smoothstep(1.0,0.82,vU.y);
        c = mix(shell*0.45, c, edge);
        gl_FragColor = vec4(mix(c, fogColor, clamp(vFog,0.0,1.0)), 1.0);
      }`});
}
/* 石材：城と鳥居に使う。岩と同じ手続き型ディテールを、軽く効かせる */
function stoneMat(hex, rough, metal){
  const m=new THREE.MeshStandardMaterial({color:hex, roughness:rough, metalness:metal||0,
    vertexColors:true, envMapIntensity:.7});
  m.extensions={derivatives:true};
  m.onBeforeCompile=sh=>{
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vSP;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\n  vSP=(modelMatrix*vec4(transformed,1.0)).xyz;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nvarying vec3 vSP;\n'+ROCK_GLSL)
      .replace('#include <color_fragment>',`#include <color_fragment>
        float sH=rockH(vSP*0.55);
        diffuseColor.rgb *= 0.80 + 0.34*sH;`)
      .replace('#include <roughnessmap_fragment>',`#include <roughnessmap_fragment>
        roughnessFactor *= 0.85 + 0.25*fbm3(vSP*0.30);`)
      .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
        { vec3 dpx=dFdx(vSP), dpy=dFdy(vSP);
          float dhx=dFdx(sH), dhy=dFdy(sH);
          vec3 r1=cross(dpy,normal), r2=cross(normal,dpx);
          float det=dot(dpx,r1);
          vec3 gr=(r1*dhx+r2*dhy)/(abs(det)<1e-7?1e-7:det);
          normal=normalize(normal-gr*0.55); }`);
  };
  return m;
}

function buildTorii(){

    const b=new THREE.CylinderGeometry(1.5,1.9,1.6,10); b.translate(s*W/2,.8,0); P.push(tint(b,DARK));
  });
  const kasa=new THREE.BoxGeometry(W*1.62,1.5,2.6); kasa.translate(0,H+.9,0); P.push(tint(kasa,DARK));
  const shim=new THREE.BoxGeometry(W*1.50,.7,2.2);  shim.translate(0,H-.1,0); P.push(tint(shim,RED));

}
/* 岩塊をいびつにする。円錐のままだと作り物に見える */
function jaggedRock(geo, radial, ridge, vert){
  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const n1=fbm(x*.085, y*.065, z*.085, 4);
    const n2=ridged(x*.048, y*.038, z*.048, 3)-.5;
    const s=1 + n1*radial + n2*ridge;
    p.setXYZ(i, x*s, y + n1*vert, z*s);
  }
  geo.computeVertexNormals(); return geo;
}

/* 天空の城：寄っても見応えが出るよう、外壁・狭間・塔・天守・門を積む */
function buildCastle(){
  const P=[];
  const STONE=0x9aa2ae, STONE2=0x848d9b, ROOF=0x2f4f78, ROOF2=0x27436a, TRIM=0xc3cad6;
  // 浮いている岩盤

  jaggedRock(rock, .36, .32, 5.0);                 // ただの円錐にしない
  P.push(tint(rock,0x4d4a52));
  // 台座
  const base=new THREE.CylinderGeometry(20,23,4,20); base.translate(0,2,0); P.push(tint(base,STONE2));
  // 外壁＋狭間
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2, r=17.5;
    P.push(tint(put(new THREE.BoxGeometry(7.2,9,2.6),
      {x:Math.cos(a)*r,y:8.5,z:Math.sin(a)*r,ry:-a}), STONE));
    for(let k=-1;k<=1;k+=2)
      P.push(tint(put(new THREE.BoxGeometry(2.1,2.2,2.6),
        {x:Math.cos(a)*r-Math.sin(-a)*k*2.0, y:14.1, z:Math.sin(a)*r-Math.cos(-a)*k*2.0, ry:-a}), TRIM));
  }
  // 門
  P.push(tint(put(new THREE.BoxGeometry(9,12,4),{x:0,y:9,z:17.5}), STONE2));
  P.push(tint(put(new THREE.BoxGeometry(5.4,7.4,4.6),{x:0,y:6.4,z:17.5}), 0x2a2118));
  // 隅塔
  for(let i=0;i<4;i++){
    const a=i/4*Math.PI*2+Math.PI/4, r=16;
    const t=new THREE.CylinderGeometry(3.4,4.2,26,12); t.translate(0,13,0);
    P.push(tint(put(t,{x:Math.cos(a)*r,z:Math.sin(a)*r}), STONE));
    const ring=new THREE.CylinderGeometry(4.4,4.4,1.4,12); ring.translate(0,25.5,0);
    P.push(tint(put(ring,{x:Math.cos(a)*r,z:Math.sin(a)*r}), TRIM));
    const rf=new THREE.ConeGeometry(5.2,10,12); rf.translate(0,31,0);
    P.push(tint(put(rf,{x:Math.cos(a)*r,z:Math.sin(a)*r}), ROOF));
    const fin=new THREE.OctahedronGeometry(1.1,0); fin.translate(0,37,0);
    P.push(tint(put(fin,{x:Math.cos(a)*r,z:Math.sin(a)*r}), 0xffd45a));
  }
  // 天守（三層）
  const k1=new THREE.CylinderGeometry(9,11,16,16); k1.translate(0,12,0); P.push(tint(k1,STONE));
  const e1=new THREE.CylinderGeometry(12,12,1.6,16); e1.translate(0,20,0); P.push(tint(e1,ROOF2));
  const k2=new THREE.CylinderGeometry(7.2,8.6,12,16); k2.translate(0,27,0); P.push(tint(k2,STONE));
  const e2=new THREE.CylinderGeometry(9.6,9.6,1.4,16); e2.translate(0,33.4,0); P.push(tint(e2,ROOF2));
  const k3=new THREE.CylinderGeometry(5.4,6.8,9,16); k3.translate(0,38.5,0); P.push(tint(k3,STONE2));
  const rk=new THREE.ConeGeometry(8.4,13,16); rk.translate(0,49.5,0); P.push(tint(rk,ROOF));
  const sp=new THREE.CylinderGeometry(.4,.4,7,6); sp.translate(0,59,0); P.push(tint(sp,TRIM));
  const cr=new THREE.OctahedronGeometry(1.9,0); cr.translate(0,63,0); P.push(tint(cr,0xffd45a));
  // 控え壁
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2;
    P.push(tint(put(new THREE.BoxGeometry(2.2,14,4.6),
      {x:Math.cos(a)*10.5,y:7,z:Math.sin(a)*10.5,ry:-a}), STONE2));
  }
  return mergeGeometries(P.map(g=>g.index?g.toNonIndexed():g), false);
}

      const t=L2?Math.max(0,Math.min(1,((x-a[0])*vx+(z-a[1])*vz)/L2)):0;

  const grp=new THREE.Group(), mat=makeRockMat(th);
  buildTerrain(sh, th, mat, grp, LOW?56:96, LOW?116:192, R_CONT);
  const fx={flows:[], curtains:[], rise:null, bolts:null, spin:null,

  const fallCurve=new THREE.CatmullRomCurve3([

const composer=new EffectComposer(renderer,rt);

const godray=new ShaderPass({
  uniforms:{tDiffuse:{value:null},uSunUV:{value:new THREE.Vector2(.5,.5)},uInt:{value:0},
            uDecay:{value:.965},uDensity:{value:.82},uWeight:{value:.055}},
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);} `,
  fragmentShader:`
    #define SAMPLES ${LOW?24:44}
    varying vec2 vUv; uniform sampler2D tDiffuse; uniform vec2 uSunUV;
    uniform float uInt,uDecay,uDensity,uWeight;
    void main(){
      vec4 base=texture2D(tDiffuse,vUv);
      if(uInt<=0.001){ gl_FragColor=base; return; }
      vec2 dir=(vUv-uSunUV)*(uDensity/float(SAMPLES));
      vec2 uv=vUv; float il=1.0; vec3 acc=vec3(0.0);
      for(int i=0;i<SAMPLES;i++){
        uv-=dir; vec3 s=texture2D(tDiffuse,clamp(uv,0.0,1.0)).rgb;
        float l=max(max(s.r,s.g),s.b);
        s*=smoothstep(0.85,2.2,l); acc+=s*il*uWeight; il*=uDecay;
      }
      gl_FragColor=vec4(base.rgb+acc*uInt, base.a);
    }`});
composer.addPass(godray);
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), LOW?.30:.40, .58, 1.05);
composer.addPass(bloom);
const cine=new ShaderPass({
  uniforms:{tDiffuse:{value:null},uT:{value:0},uVig:{value:.82},uGrain:{value:.026},uCA:{value:.0020}},
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);} `,
  fragmentShader:`
    varying vec2 vUv; uniform sampler2D tDiffuse; uniform float uT,uVig,uGrain,uCA;
    void main(){
      vec2 d=vUv-0.5; float r2=dot(d,d); vec2 off=d*uCA*(r2*3.0);
      vec3 c; c.r=texture2D(tDiffuse,vUv+off).r; c.g=texture2D(tDiffuse,vUv).g; c.b=texture2D(tDiffuse,vUv-off).b;
      c *= mix(1.0, smoothstep(0.98,0.18,r2*2.1), uVig);
      float g=fract(sin(dot(vUv*vec2(1234.5,7654.3)+fract(uT),vec2(12.9898,78.233)))*43758.5453);
      gl_FragColor=vec4(c+(g-0.5)*uGrain,1.0);
    }`});
composer.addPass(cine);
composer.addPass(new OutputPass());

function flyTo(target,dist,elev=.36,azi=null){
  // azi を渡すと、その方角から寄る（見どころごとに構図を変えるため）
  const dir = azi===null
    ? new THREE.Vector3().subVectors(camera.position,target).normalize()
    : new THREE.Vector3(Math.cos(azi),0,Math.sin(azi));
  dir.y=Math.max(dir.y,elev); dir.normalize();
  camWant.copy(target).add(dir.multiplyScalar(dist));
  tgtWant.copy(target); flying=true; controls.autoRotate=false;
}

/* 見どころへ寄る位置を決める。
   ・手前の木や景物が視線を塞がない方角を、10方向試して選ぶ
   ・地面にめり込まないよう、その場の地表より上へ持ち上げる */
function focusSection(I,k){
  const p=I.marks[k].pos.clone().add(I.grp.position); p.y+=1.4;
  const sc=I.secScale||1, dist=(12+(k%3)*3.4)*sc, elev=.10+(k%4)*.055;
  const objs=I.grp.children.filter(o=>o.userData.occluder);
  let bestCam=null, bestScore=-Infinity;
  for(let i=0;i<10;i++){
    const azi=k*2.39996 + i/10*Math.PI*2;
    const dir=new THREE.Vector3(Math.cos(azi),0,Math.sin(azi));
    dir.y=Math.max(dir.y,elev); dir.normalize();
    const cam=p.clone().add(dir.multiplyScalar(dist));
    const gy=I.sh.surfaceY(cam.x-I.grp.position.x, cam.z-I.grp.position.z)+I.grp.position.y+2.8*sc;
    if(cam.y<gy) cam.y=gy;
    const d=cam.distanceTo(p);
    ray.set(cam, tmpV.copy(p).sub(cam).normalize()); ray.far=d;
    let score=0;
    for(const h of ray.intersectObjects(objs,false)) if(h.distance<d-2.5) score-=(d-h.distance);
    if(score>bestScore){ bestScore=score; bestCam=cam; }
  }
  ray.far=Infinity;                       // クリック判定と共用なので必ず戻す
  camWant.copy(bestCam); tgtWant.copy(p); flying=true; controls.autoRotate=false;
}
function enterIsland(i){
  focus=i; const I=islands[i];
  islands.forEach((s,k)=>{ s.marks.forEach(m=>m.g.visible = k===i); s.lab.visible = false; });
  const hx=I.grp.position.clone(); hx.y+=I.top*.5;
  flyTo(hx, I.viewDist||74, .30);
  isleHdr.classList.add('on'); backBtn.classList.add('on');
  isleHdr.querySelector('.n').textContent = `${I.data.no} ／ ${I.data.tag}`;
  isleHdr.querySelector('.n').style.color = '#'+I.th.glow.toString(16).padStart(6,'0');
  isleHdr.querySelector('.t').textContent = I.data.title;
  isleHdr.querySelector('.c').textContent =
    `光る門「▶ 入口」をクリック → そこから ${I.marks.length} か所を順にたどれます`;
  // 隣の島へ、全景に戻らず直接移れるように
  const pv=document.getElementById('isPrev'), nx=document.getElementById('isNext');
  pv.disabled = i<=0; nx.disabled = i>=islands.length-1;
  const tp=document.getElementById('isTop');
  tp.style.display = (i===islands.length-1) ? 'none' : '';
  pv.textContent = i>0 ? `← ${islands[i-1].data.no} ${islands[i-1].data.tag}` : '←';
  nx.textContent = i<islands.length-1 ? `${islands[i+1].data.no} ${islands[i+1].data.tag} →` : '→';
  head.style.opacity=0; hint.style.opacity=0;
}
function leaveIsland(){
  focus=-1; closePanel(false);
  islands.forEach(s=>{ s.marks.forEach(m=>m.g.visible=false); s.lab.visible=true; });
  camWant.copy(HOME_CAM); tgtWant.copy(HOME_TGT); flying=true; controls.autoRotate=false;
  isleHdr.classList.remove('on'); backBtn.classList.remove('on');
  head.style.opacity=1; hint.style.opacity=1;
}
function openSec(i,k){
  const I=islands[i], sec=I.data.sections[k];
  if(focus!==i) enterIsland(i);
  opened=k;
  const hex='#'+I.th.glow.toString(16).padStart(6,'0');
  $('.no').textContent=`${I.data.no} ／ 見どころ ${k+1} / ${I.data.sections.length}`;
  $('.no').style.color=hex;
  $('h2').textContent=sec.h;
  $('.lead').textContent=sec.t;
  $('ul').innerHTML=(sec.b||[]).map(b=>`<li>${b}</li>`).join('');
  const st=document.getElementById('liDot')||document.createElement('style');
  st.id='liDot'; st.textContent=`#panel li::before{background:${hex};box-shadow:0 0 10px ${hex};}`;
  document.head.appendChild(st);
  const img=$('img');
  const fig = sec.img || (k===0 ? I.data.img : null);   // 図解は本文の挿入指定どおりの節に出す
  if(fig){ img.hidden=false; img.src=fig; } else img.hidden=true;
  $('.full').textContent=I.data.full;
  const a=$('.art'), link=sec.video||I.data.url;
  if(link){ a.href=link; a.classList.remove('off');
    a.textContent = sec.video ? '▶ 解説動画を見る' : 'この回を読む'; }
  else { a.removeAttribute('href'); a.classList.add('off'); a.textContent='この回は公開後にリンクします'; }
  document.getElementById('prev').disabled = k<=0;
  document.getElementById('next').disabled = k>=I.data.sections.length-1;
  panel.classList.add('open'); isleHdr.classList.add('dim');
  focusSection(I,k);
}
function closePanel(back=true){
  if(opened<0 && !panel.classList.contains('open')) return;
  opened=-1; panel.classList.remove('open'); isleHdr.classList.remove('dim');
  if(back && focus>=0){ const I=islands[focus];
    const hx=I.grp.position.clone(); hx.y+=I.top*.5; flyTo(hx,74,.30); }
}
document.getElementById('close').onclick=()=>closePanel();
backBtn.onclick=()=>leaveIsland();
/* 大陸へは、支柱に沿って一度上昇してから渡る（エフェクトを見せながら飛ぶ） */
document.getElementById('isTop').onclick=()=>{
  if(focus<0 || focus===islands.length-1) return;
  const p=islands[focus].grp.position;
  closePanel(false);
  camWant.set(p.x+52, p.y+120, p.z+92); tgtWant.set(p.x, p.y+96, p.z);
  flying=true; controls.autoRotate=false;
  flyThen=()=>enterIsland(islands.length-1);
};
document.getElementById('isPrev').onclick=()=>{ if(focus>0){ closePanel(false); enterIsland(focus-1); } };
document.getElementById('isNext').onclick=()=>{
  if(focus>=0 && focus<islands.length-1){ closePanel(false); enterIsland(focus+1); } };
document.getElementById('prev').onclick=()=>{ if(focus>=0&&opened>0) openSec(focus,opened-1); };
document.getElementById('next').onclick=()=>{
  if(focus>=0&&opened<islands[focus].data.sections.length-1) openSec(focus,opened+1); };
addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(panel.classList.contains('open')) closePanel(); else if(focus>=0) leaveIsland();
});

function setPtr(e){ const t=e.touches?e.touches[0]:e;
  ptr.x=(t.clientX/innerWidth)*2-1; ptr.y=-(t.clientY/innerHeight)*2+1; }
renderer.domElement.addEventListener('pointermove',e=>{ setPtr(e); idleAt=performance.now();
  tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; });
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{ down=[e.clientX,e.clientY];
  idleAt=performance.now(); controls.autoRotate=false; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down) return;
  const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null; idleAt=performance.now();
  if(moved > (e.pointerType==='touch' ? 16 : 7)) return;   // 指は少し動くので甘めに
  setPtr(e); ray.setFromCamera(ptr,camera);
  if(focus>=0){
    const hits=ray.intersectObjects(islands[focus].marks.map(m=>m.hit),false);
    if(hits.length){ openSec(focus, hits[0].object.userData.sec); return; }
  }
  const tops=islands.map(s=>s.grp);
  const h=ray.intersectObjects(tops,true)[0];
  if(h){
    let o=h.object; while(o.parent && !tops.includes(o)) o=o.parent;
    const i=tops.indexOf(o);
    if(i>=0 && i!==focus){ enterIsland(i); return; }
  }
  if(panel.classList.contains('open')) closePanel();
});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth,innerHeight);
});

/* ══════════ 10. ループ ══════════ */
const clock=new THREE.Clock(), sunNDC=new THREE.Vector3(), tmpV=new THREE.Vector3();
const dmA=new THREE.Object3D(), vA=new THREE.Vector3(), vB=new THREE.Vector3();
const UPV=new THREE.Vector3(0,1,0);

/* 雷：見どころどうしを結び、時おり天へ伸びる */
function updateBolts(b,t){
  b.lines.material.opacity = .30 + Math.random()*.55;
  if(t < b.next) return;
  b.next = t + .16 + Math.random()*.34;
  const {pos,NB,SEG,spots,src}=b;
  let o=0;
  for(let i=0;i<NB;i++){
    const a=spots[(Math.random()*spots.length)|0];
    const r=Math.random();
    const fromCrystal = src && r<.45;      // 崖下のクリスタルから地表へ
    const sky = !fromCrystal && r>.78;     // 地表から天へ
    const e=spots[(Math.random()*spots.length)|0];
    if(fromCrystal) vA.copy(src); else vA.set(a.x, a.y+2.6, a.z);
    if(fromCrystal)   vB.set(a.x, a.y+2.6, a.z);
    else if(sky)      vB.set(a.x+(Math.random()-.5)*22, a.y+46+Math.random()*46, a.z+(Math.random()-.5)*22);
    else              vB.set(e.x, e.y+2.6, e.z);
    let px=vA.x, py=vA.y, pz=vA.z;
    for(let s=1;s<=SEG;s++){
      const u=s/SEG;
      const qx=vA.x+(vB.x-vA.x)*u+(Math.random()-.5)*3.4;
      const qy=vA.y+(vB.y-vA.y)*u+(Math.random()-.5)*2.6;
      const qz=vA.z+(vB.z-vA.z)*u+(Math.random()-.5)*3.4;
      pos[o++]=px; pos[o++]=py; pos[o++]=pz;
      pos[o++]=qx; pos[o++]=qy; pos[o++]=qz;
      px=qx; py=qy; pz=qz;
    }
  }
  b.lines.geometry.attributes.position.needsUpdate=true;
}
function animate(){
  requestAnimationFrame(animate);
  const rawDt=clock.getDelta();
  const dt=Math.min(rawDt,.05), t=clock.elapsedTime;

  clouds.forEach(c=>c.material.uniforms.uT.value=t);
  RISERS.forEach(r=>{
    if(r.kind==='flow'){  r.o.material.uniforms.uT.value=t; return; }
    if(r.kind==='flame'){ r.tube.material.uniforms.uT.value=t; return; }
    if(r.kind==='bolt'){  updateRiseBolt(r,t); return; }
    const {im,list,x,z,y0,h}=r;                      // 粒が渦を巻きながら昇る
    list.forEach((o,i)=>{
      const q=(t*o.sp+o.ph)%1;
      const a=o.a + t*o.sw*.5 + q*2.3;
      const rr=o.rr*(1-q*.45);
      dmA.position.set(x+Math.cos(a)*rr, y0+h*q, z+Math.sin(a)*rr);
      dmA.rotation.set(t*o.sx, t*o.sy, t*o.sx*.7);
      dmA.scale.setScalar(Math.max(.05, o.s*(1-q*.35)));
      dmA.updateMatrix(); im.setMatrixAt(i, dmA.matrix);
    });
    im.instanceMatrix.needsUpdate=true;
  });
  WATERS.forEach(m=>{ if(m.userData.sh) m.userData.sh.uniforms.uT.value=t; });
  cine.uniforms.uT.value=t;
  islands.forEach((I,i)=>{
    I.motes.material.uniforms.uT.value=t;
    I.fx.flows.forEach(f=>f.material.uniforms.uT.value=t);
    I.fx.curtains.forEach(c=>c.material.uniforms.uT.value=t);

    if(I.fx.rise){                       // 小さな鉱石が空へ吸い上げられていく
      const {mesh,list}=I.fx.rise;
      list.forEach((r,k)=>{
        const tt=(t*r.sp+r.ph)%1;
        dmA.position.set(r.x, 2+(92-2)*tt, r.z);
        dmA.rotation.set(t*1.3+k, t*1.05+k, 0);
        dmA.scale.setScalar(Math.max(.03, r.s*(1-tt*.6)));
        dmA.updateMatrix(); mesh.setMatrixAt(k, dmA.matrix);
      });
      mesh.instanceMatrix.needsUpdate=true;
    }
    if(I.fx.spin){                       // 結晶がくるくる回る
      const {mesh,base}=I.fx.spin;
      base.forEach((b,k)=>{
        dmA.position.copy(b.p);
        dmA.rotation.set(Math.sin(t*.55+b.ph)*.32, t*.85+b.ph, 0);
        dmA.scale.copy(b.s); dmA.updateMatrix(); mesh.setMatrixAt(k, dmA.matrix);
      });
      mesh.instanceMatrix.needsUpdate=true;
    }
    if(I.fx.grow){                       // 下面の鉱石が、エネルギーを吸って育つ
      const {mesh,list}=I.fx.grow;
      list.forEach((o,k)=>{
        const pu=.5+.5*Math.sin(t*.40+o.ph);
        dmA.position.copy(o.p);
        dmA.rotation.set(Math.sin(t*.17+o.ph)*.5, t*.11+o.ph, 0);
        dmA.scale.setScalar(o.s*(.76+pu*.36));
        dmA.updateMatrix(); mesh.setMatrixAt(k, dmA.matrix);
      });
      mesh.instanceMatrix.needsUpdate=true;
    }
    if(I.fx.bigCrystal){                 // 雷の源
      I.fx.bigCrystal.rotation.y=t*.22;
      I.fx.bigCrystal.material.emissiveIntensity=1.3+Math.sin(t*2.1)*.7;
    }
    if(I.fx.bolts) updateBolts(I.fx.bolts, t);
    if(I.fx.lavas) I.fx.lavas.forEach(m=>{ m.uniforms.uT.value=t; });
    if(I.fx.arrows) I.fx.arrows.forEach(A=>{     // 道と崖と、城へ昇る矢印
      const {mesh,curve,n,sh,onTerrain}=A;
      for(let k=0;k<n;k++){
        const u=((t*.02)+k/n)%1;
        const p=curve.getPointAt(u), tg=curve.getTangentAt(u).normalize();
        dmA.position.set(p.x, onTerrain ? sh.surfaceY(p.x,p.z)+3.6 : p.y, p.z);
        dmA.quaternion.setFromUnitVectors(UPV, tg);
        dmA.scale.setScalar(1); dmA.updateMatrix();
        mesh.setMatrixAt(k, dmA.matrix);
      }
      mesh.instanceMatrix.needsUpdate=true;
    });
    if(I.fx.bubbles){                    // 溶岩の泡
      const {mesh,list}=I.fx.bubbles;
      list.forEach((b,k)=>{
        const w=Math.abs(Math.sin(t*1.6+b.ph));
        dmA.position.set(b.x, b.y+w*2.8, b.z);
        dmA.quaternion.identity();
        dmA.scale.setScalar(b.s*(.65+.45*w)); dmA.updateMatrix();
        mesh.setMatrixAt(k, dmA.matrix);
      });
      mesh.instanceMatrix.needsUpdate=true;
    }

    I.marks.forEach((m,k)=>{
      if(!m.g.visible) return;
      const pu=.5+.5*Math.sin(t*1.3+k*1.1);
      const on=(i===focus && k===opened) || (hover && hover.isle===i && hover.sec===k);
      m.orb.position.y=2.4+Math.sin(t*.9+k)*.22;
      m.halo.position.y=m.orb.position.y; m.num.position.y=m.orb.position.y;
      m.halo.scale.setScalar(4.2+pu*1.2+(on?2.4:0));
      m.halo.material.opacity=.34+pu*.16+(on?.28:0);
      m.orb.material.emissiveIntensity=1.3+pu*.5+(on?1.2:0);
      if(m.ring){                        // 入口の門は、まだ読んでいない間だけ強く光る
        const un = opened<0 ? 1 : .35;
        m.ring.rotation.z += dt*.55;
        m.ring.scale.setScalar(1+Math.sin(t*1.8)*.06);
        m.ring.material.emissiveIntensity=(1.8+pu*1.8)*un;
        if(m.gate) m.gate.material.opacity=(.55+pu*.45)*un;
      }
    });
  });

  // ホバー：マーカーの見出しをツールチップで出す
  if(focus>=0){
    ray.setFromCamera(ptr,camera);
    const hits=ray.intersectObjects(islands[focus].marks.map(m=>m.hit),false);
    const u=hits.length?hits[0].object.userData:null;
    if((u&&(!hover||hover.sec!==u.sec)) || (!u&&hover)){
      hover=u;
      if(u){ tip.textContent=islands[u.isle].data.sections[u.sec].h; tip.classList.add('on');
             renderer.domElement.style.cursor='pointer'; }
      else { tip.classList.remove('on'); renderer.domElement.style.cursor='grab'; }
    }
  } else if(hover){ hover=null; tip.classList.remove('on'); }

  if(flying){
    // 飛行だけは実経過時間で進める（描画が重い環境でも同じ時間で寄り切るように）
    const k=1-Math.pow(.0012, Math.min(rawDt,.3));
    camera.position.lerp(camWant,k); controls.target.lerp(tgtWant,k);
    if(camera.position.distanceTo(camWant)< (flyThen?6:.7)){
      flying=false; idleAt=performance.now();
      if(flyThen){ const f=flyThen; flyThen=null; f(); }
      // 寄り切ったら、ゆっくり回して角度を変える（手前の物で塞がれても見えるように）
      if(opened>=0){ controls.autoRotateSpeed=.30; controls.autoRotate=true; }
    }
  } else if(performance.now()-idleAt>10000 && focus<0 && opened<0){
    controls.autoRotateSpeed=.16; controls.autoRotate=true;
  }
  controls.update();

  sunNDC.copy(SUN_POS).project(camera);
  const behind=sunNDC.z>1;
  godray.uniforms.uSunUV.value.set((sunNDC.x+1)/2,(sunNDC.y+1)/2);
  const edge=Math.max(Math.abs(sunNDC.x),Math.abs(sunNDC.y));
  const vis=behind?0:(1-THREE.MathUtils.clamp((edge-.85)/1.15,0,1));
  godray.uniforms.uInt.value += ((LOW?.24:.34)*vis - godray.uniforms.uInt.value)*.06;

  composer.render();
}

/* ══════════ 11. 起動（島を1つずつ組んで、進捗を出す） ══════════ */
const load=document.getElementById('load'), bar=load.querySelector('i'), sub=load.querySelector('.s');
(async function boot(){
  for(let i=0;i<DATA.length;i++){
    sub.textContent = `${THEMES[DATA[i].theme].label} を生成中… (${i+1}/${DATA.length})`;
    bar.style.width = Math.round((i/DATA.length)*88)+'%';
    await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
    const I=buildIsland(i);
    const [gx,gy,gz]=LAYOUT[i];
    I.grp.position.set(gx*SPACING, gy, gz);
    scene.add(I.grp); islands.push(I);
  }
  // 5島の上空に、内製化ロードマップの大陸を架ける
  sub.textContent='内製化の大陸を生成中…'; bar.style.width='90%';
  await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
  const C=buildContinent();
  C.grp.position.set(0, 178, -25);
  scene.add(C.grp); islands.push(C);

  // 5島 → 大陸。島の性質そのものが昇っていく形にする
  const contBottom = C.grp.position.y + C.sh.botY(0,0,0) + 8;
  const RISE_KIND = {crystal:'shard', strata:'leaf', volcano:'flame', metal:'gem', storm:'bolt'};
  islands.slice(0,5).forEach(I=>{
    const px=I.grp.position.x, pz=I.grp.position.z;
    const y0=I.grp.position.y + I.top + 3, h=Math.max(24, contBottom-y0);
    makeRiser(RISE_KIND[I.data.theme], px, pz, y0, h, I.th.glow);
  });

  sub.textContent='仕上げ中…'; bar.style.width='95%';
  HOME_CAM.set(170, 130, 790); HOME_TGT.set(0, 80, 0);   // 島の層と大陸の層が重なって見える高さ
  camera.position.copy(HOME_CAM); controls.target.copy(HOME_TGT); controls.update();

  window.__map={THREE,renderer,scene,camera,controls,composer,islands,enterIsland,openSec,
    view(p,t){ camera.position.set(p[0],p[1],p[2]); controls.target.set(t[0],t[1],t[2]);
      controls.autoRotate=false; flying=false; controls.update(); composer.render(); }};

  await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
  renderer.compile(scene,camera);
  animate();
  bar.style.width='100%';
  setTimeout(()=>{ load.classList.add('gone'); renderer.domElement.style.cursor='grab'; },420);
})();
</script>
