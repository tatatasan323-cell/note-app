<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIアーキテクチャ 全体地図（簡易版） ─ 6層＋4横断面</title>
<style>
:root{--ink:#eef4fb;--sub:#a8bccf;--line:#2e4258;}
*{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:#070f1e;
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;color:var(--ink)}
#app{position:fixed;inset:0}
.lbl{font-size:13px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;
  background:rgba(7,14,26,.66);border:1px solid var(--line);box-shadow:0 3px 12px rgba(0,0,0,.5);pointer-events:none;backdrop-filter:blur(2px)}
.lbl.cross{color:#cfe6ff;border-color:#5a6fa0}
#tip{position:fixed;z-index:8;display:none;max-width:320px;color:#eef4fb;font-size:1.05rem;line-height:1.5;
  background:rgba(7,14,26,.94);border:1px solid #3a5575;border-radius:10px;padding:10px 13px;box-shadow:0 6px 22px rgba(0,0,0,.6);pointer-events:none;backdrop-filter:blur(2px)}
#tip b{display:block;margin-bottom:3px;font-size:1.1rem}
#tip .ex{display:block;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.18);color:#8fd0ff;font-size:.86rem;line-height:1.45}
#title{position:fixed;left:14px;top:12px;z-index:5;max-width:52%;padding:8px 14px 10px;border-radius:14px;background:rgba(8,16,32,.42);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-shadow:0 2px 8px rgba(0,0,0,.6)}
#title h1{font-size:1.5rem;margin:0 0 5px} #title .desc{margin:0;color:var(--ink);opacity:.85;font-size:.98rem;line-height:1.55}
#title .ops{margin:5px 0 0;color:var(--sub);font-size:.9rem}
footer{position:fixed;left:16px;bottom:10px;z-index:5;color:var(--sub);font-size:.74rem;text-shadow:0 1px 4px rgba(0,0,0,.85)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8fb4d6;z-index:9}
@media(max-width:600px){
  #title{max-width:84%;left:10px;top:8px} #title h1{font-size:1.1rem} #title .desc{display:none} #title .ops{font-size:.72rem}
  .lbl{font-size:11px} #tip{font-size:.95rem;max-width:78vw}
  footer{font-size:.64rem}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">地図を描いています･･･</div>
<div id="title">
  <h1>AIアーキテクチャ 全体地図（簡易版）</h1>
  <p class="desc">6つの層（下＝土台 → 上＝窓口）と、それを貫く4つの横断面。全体を俯瞰するための地図です。細かい中身は、各項目をAIに伴走してもらって学べばOK。</p>
  <p class="ops">各層・横断面にマウスを乗せる（スマホはタップ）と概要。ドラッグで回転／ホイール・2本指で拡大。</p>
</div>
<div id="tip"></div>
<footer>制作：AI内製化工房 MITA ｜ 公式チャンネル：https://note.com/ai_naiseika ｜ 俯瞰用の簡易版</footer>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three@0.160.0/build/three.module.js",
  "three/addons/": "./vendor/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const app=document.getElementById('app');
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x070f1e,0.016);
const camera=new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
app.appendChild(renderer.domElement);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const labelRenderer=new CSS2DRenderer(); labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.position='fixed'; labelRenderer.domElement.style.top='0'; labelRenderer.domElement.style.pointerEvents='none';
app.appendChild(labelRenderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.autoRotate=true; controls.autoRotateSpeed=0.5; controls.minDistance=8; controls.maxDistance=46;

scene.add(new THREE.HemisphereLight(0xbfe0ff,0x12203a,1.0));
const key=new THREE.DirectionalLight(0xffffff,0.8); key.position.set(9,18,12); scene.add(key);
const rim=new THREE.DirectionalLight(0x7fb0ff,0.5); rim.position.set(-12,6,-10); scene.add(rim);

// 背景グラデ
const sky=new THREE.Mesh(new THREE.SphereGeometry(140,18,10), new THREE.ShaderMaterial({side:THREE.BackSide,
  uniforms:{top:{value:new THREE.Color(0x070f1e)},bot:{value:new THREE.Color(0x183356)}},
  vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'varying float h;uniform vec3 top;uniform vec3 bot;void main(){gl_FragColor=vec4(mix(bot,top,smoothstep(-0.4,0.7,h)),1.0);}'}));
scene.add(sky);

// 漂う粒子（リッチさ）
const pc=520, pg=new THREE.BufferGeometry(), pa=new Float32Array(pc*3);
for(let i=0;i<pc;i++){ const a=Math.random()*6.28, r=6+Math.random()*30; pa[i*3]=Math.cos(a)*r; pa[i*3+1]=-2+Math.random()*18; pa[i*3+2]=Math.sin(a)*r; }
pg.setAttribute('position',new THREE.BufferAttribute(pa,3));
const particles=new THREE.Points(pg,new THREE.PointsMaterial({color:0x9fd0ff,size:0.07,transparent:true,opacity:.5,depthWrite:false}));
scene.add(particles);

function glowTex(stops){ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64); stops.forEach(s=>gr.addColorStop(s[0],s[1])); g.fillStyle=gr; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); }
function glowSprite(color){ const t=glowTex([[0,'rgba(255,255,255,0.55)'],[0.4,color.replace('1)','0.4)')],[1,color.replace('1)','0)')]]);
  return new THREE.Sprite(new THREE.SpriteMaterial({map:t,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true})); }
function label(text,cls,x,y,z){ const d=document.createElement('div'); d.className='lbl '+(cls||''); d.textContent=text;
  const o=new CSS2DObject(d); o.position.set(x,y,z); scene.add(o); return o; }

const LAYERS=[
 {n:'① インフラ層（土台）', c:0x5a86d6, d:'どこで動かすか。クラウドか社内か。ここの選択が、上の全層に波及する“土台”。<span class="ex">実例（#14）: GitHubは“設計図の出版元”で、システムが動く場所ではない。動くのは各自のPCの上（GitHub Pagesの体験版も、計算しているのは開いた人のブラウザ）。</span>'},
 {n:'② データ層（素材）', c:0x36c8d8, d:'AIの賢さは「食わせるデータ」で決まる。何を・どう持ち、どう渡すか。<span class="ex">実例（#13）: 数字の住所を1か所に＝SQLite1ファイル。住所が1つなら“転記”は存在できない。</span>'},
 {n:'③ 統合・連携層（つなぐ）', c:0x33d49a, d:'ゼロから作るより、既にある道具（表計算・会計・在庫）と繋ぐのが中小の主戦場。'},
 {n:'④ AIエンジン層（頭脳）', c:0x86d63c, d:'そもそもAIを使うか。使うならどれを・どこで。賢さ・コスト・機密のトレードオフが最も濃い。'},
 {n:'⑤ アプリ層（仕事）', c:0xf0b82e, d:'AIにどんな“仕事の形”をさせるか。欲張ると複雑、絞ると続く。<span class="ex">実例（#13/#14）: 一元管理システムの心臓部（Python）はここ。ブラウザの檻の外＝PC上に住むから、貯めて・書き出せる。</span>'},
 {n:'⑥ インターフェース層（窓口）', c:0xf0792e, d:'人がどこで触れるか。中身が良くても、ここが使いにくいと使われない。<span class="ex">実例（#14）: “HTML1枚の道具”は、この層とアプリ層を1枚に畳んだ姿。ブラウザ＝檻の中だから安全と言い切れて、そのかわり貯められない。</span>'},
];
const W=7, D=5, H=1.15, GAP=0.75, N=LAYERS.length;
// 2026-10-11 少しだけリッチに：層の回路の格子・光のにじみ・下から上へ昇るデータの粒・台座の光る縁と目盛り（文言と並びは前の版のまま）
const circuitTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d'); g.fillStyle='#000'; g.fillRect(0,0,256,256);
  g.strokeStyle='rgba(255,255,255,0.9)'; g.lineWidth=1.4; g.beginPath();
  for(let i=0;i<=8;i++){ const v=i*32; g.moveTo(v,0); g.lineTo(v,256); g.moveTo(0,v); g.lineTo(256,v); } g.globalAlpha=0.35; g.stroke(); g.globalAlpha=1;
  let sd=7; const rnd=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647; };
  g.lineWidth=2.2; for(let k=0;k<14;k++){ let x=Math.floor(rnd()*8)*32, y=Math.floor(rnd()*8)*32; g.beginPath(); g.moveTo(x,y);
    for(let s=0;s<4;s++){ if(rnd()<0.5) x+=(rnd()<0.5?-1:1)*32; else y+=(rnd()<0.5?-1:1)*32; g.lineTo(x,y); } g.stroke(); g.beginPath(); g.arc(x,y,4,0,6.3); g.fillStyle='#fff'; g.fill(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1.4,1); return t; })();
const hoverable=[];

// 台座（反射する床）
const base=new THREE.Mesh(new THREE.CylinderGeometry(6.2,6.6,0.5,48), new THREE.MeshStandardMaterial({color:0x10203a,metalness:.8,roughness:.25}));
base.position.y=-H/2-0.5; scene.add(base);

LAYERS.forEach((L,i)=>{
  const y=i*(H+GAP);
  const mat=new THREE.MeshStandardMaterial({color:L.c,metalness:.35,roughness:.18,transparent:true,opacity:.62,emissive:L.c,emissiveIntensity:.55,emissiveMap:circuitTex});
  const slab=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),mat); slab.position.y=y; scene.add(slab);
  const edge=new THREE.LineSegments(new THREE.EdgesGeometry(slab.geometry), new THREE.LineBasicMaterial({color:new THREE.Color(L.c).lerp(new THREE.Color(0xffffff),0.55).multiplyScalar(1.6),transparent:true,opacity:.75}));
  edge.position.y=y; scene.add(edge);
  const gs=glowSprite('rgba('+[(L.c>>16)&255,(L.c>>8)&255,L.c&255].join(',')+',1)'); gs.position.set(0,y,0); gs.scale.set(W*1.5,H*3,1); scene.add(gs);
  label(L.n,'',W/2+0.55,y,0);
  slab.userData={name:L.n,desc:L.d}; hoverable.push({mesh:slab,mat,baseEI:.55});
});

// 4横断面＝全層を貫く柱
const baseY=-H/2, topY=(N-1)*(H+GAP)+H/2, totalH=topY-baseY;
const CROSS=[
 {n:'🛡 セキュリティ', c:0xff6b8a, sx:-1, sz:-1, d:'1つの層でなく“全層を貫く守り”。完璧は無く、社内でトレードオフして有限化する。'},
 {n:'運用', c:0x2ec4ff, sx:1, sz:-1, d:'作って終わりでなく、動かし続け育てる。弱いと「動いたのに続かない」。'},
 {n:'⚖ ガバナンス', c:0xb96bff, sx:-1, sz:1, d:'やっていい/いけないの線引きと責任。まずはA4一枚のAI利用ルールから。'},
 {n:'コスト', c:0xffd166, sx:1, sz:1, d:'結局いくらか。見える料金＋隠れコストの総額（TCO）で判断。経営者の第一関心。'},
];
// 6つの層を“貫く”4枚の横断板（縦・横並び・薄くして層を覆わず上下に突き出る）
const plateY=(baseY+topY)/2, plateH=totalH+2.5, platesX=[-2.55,-0.85,0.85,2.55];
CROSS.forEach((C,i)=>{
  const px=platesX[i];
  const mat=new THREE.MeshStandardMaterial({color:C.c,metalness:.35,roughness:.2,transparent:true,opacity:.5,emissive:C.c,emissiveIntensity:.5,side:THREE.DoubleSide,depthWrite:false});
  const plate=new THREE.Mesh(new THREE.BoxGeometry(0.14,plateH,D*0.86),mat); // 薄(x)・縦に層を貫き上下へ突出(y)・奥行き方向に貫く(z)
  plate.position.set(px,plateY,0); scene.add(plate);
  const cap=new THREE.Mesh(new THREE.SphereGeometry(0.24,16,16),new THREE.MeshStandardMaterial({color:C.c,emissive:C.c,emissiveIntensity:1.0})); cap.position.set(px,plateY+plateH/2-0.3,0); scene.add(cap);
  label(C.n,'cross',px,plateY+plateH/2+(innerWidth<600&&i%2?1.15:0.5),0);   // スマホの幅だけ互い違いの2段（同じ高さだと4つの名札が重なって字が隠れた。PCで上げると題の枠の裏に隠れた 2026-10-13）
  plate.userData={name:C.n,desc:C.d}; hoverable.push({mesh:plate,mat,baseEI:.5});
});

{ const by=-H/2-0.25;
  const rim=new THREE.Mesh(new THREE.TorusGeometry(6.4,0.06,8,96),new THREE.MeshBasicMaterial({color:new THREE.Color(0x5fd0ff).multiplyScalar(2.2)})); rim.rotation.x=Math.PI/2; rim.position.y=by; scene.add(rim);
  for(const r of [2.2,3.6,5.0]){ const m=new THREE.Mesh(new THREE.RingGeometry(r-0.02,r+0.02,96),new THREE.MeshBasicMaterial({color:0x5fb8ff,transparent:true,opacity:.35,side:THREE.DoubleSide})); m.rotation.x=-Math.PI/2; m.position.y=by+0.01; scene.add(m); }
  for(let k=0;k<24;k++){ const a=k/24*Math.PI*2, m=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.01,0.5),new THREE.MeshBasicMaterial({color:0x5fb8ff,transparent:true,opacity:.45})); m.position.set(Math.cos(a)*5.75,by+0.01,Math.sin(a)*5.75); m.rotation.y=-a; scene.add(m); } }
const FLOW=90, flowG=new THREE.BufferGeometry(), flowP=new Float32Array(FLOW*3), flowC=new Float32Array(FLOW*3), flowS=[];
for(let i=0;i<FLOW;i++){ flowS.push({x:(Math.random()-0.5)*W*0.86, z:(Math.random()-0.5)*D*0.8, ph:Math.random(), sp:0.06+Math.random()*0.06}); }
flowG.setAttribute('position',new THREE.BufferAttribute(flowP,3)); flowG.setAttribute('color',new THREE.BufferAttribute(flowC,3));
const flowDot=glowTex([[0,'rgba(255,255,255,1)'],[0.3,'rgba(255,255,255,0.6)'],[1,'rgba(255,255,255,0)']]);
const flow=new THREE.Points(flowG,new THREE.PointsMaterial({size:0.38,map:flowDot,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})); flow.frustumCulled=false; scene.add(flow);
const LC=LAYERS.map(L=>new THREE.Color(L.c)), _fc=new THREE.Color();
function stepFlow(t){ const y0=-H/2-0.2, y1=(N-1)*(H+GAP)+H/2+1.2;   // データは土台から窓口へ。通る層の色に染まる
  flowS.forEach((f,i)=>{ const u=(f.ph+t*f.sp)%1, y=y0+(y1-y0)*u; flowP[i*3]=f.x; flowP[i*3+1]=y; flowP[i*3+2]=f.z;
    const li=Math.max(0,Math.min(N-1,Math.round(y/(H+GAP)))); _fc.copy(LC[li]).lerp(new THREE.Color(1,1,1),0.35).multiplyScalar(1.4*Math.sin(Math.PI*u)); _fc.toArray(flowC,i*3); });
  flowG.attributes.position.needsUpdate=flowG.attributes.color.needsUpdate=true; }

const CTRY=(N-1)*(H+GAP)/2;
controls.target.set(0,CTRY+1.4,0);   // 層スタックの中心＝回転軸（少し上を見て、上の名札が題にかぶらないように）
camera.position.set(12,CTRY+7,17);
if(innerWidth<600){ camera.position.set(16,CTRY+9,27); }

// ===== ホバー／タップで簡易解説 =====
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); const tip=document.getElementById('tip');
function setHover(mesh){ for(const h of hoverable){ const on=h.mesh===mesh; h.mat.emissiveIntensity=on?h.baseEI+0.6:h.baseEI; h.mesh.scale.setScalar(on?1.05:1); } }
function showTip(e){ mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1; ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(hoverable.map(h=>h.mesh),false);
  if(hit.length){ const h=hoverable.find(x=>x.mesh===hit[0].object); tip.innerHTML='<b>'+h.mesh.userData.name+'</b>'+h.mesh.userData.desc; tip.style.display='block';
    const pad=14,w=tip.offsetWidth,hh=tip.offsetHeight; let x=e.clientX+16,y=e.clientY+16;
    if(x+w>innerWidth-pad)x=e.clientX-w-16; if(y+hh>innerHeight-pad)y=innerHeight-hh-pad; if(x<pad)x=pad; if(y<pad)y=pad;
    tip.style.left=x+'px'; tip.style.top=y+'px'; setHover(h.mesh); controls.autoRotate=false; }
  else { tip.style.display='none'; setHover(null); } }
renderer.domElement.addEventListener('pointermove',e=>{ if(e.pointerType!=='touch') showTip(e); });
renderer.domElement.addEventListener('pointerdown',showTip);
renderer.domElement.addEventListener('pointerleave',e=>{ if(e.pointerType==='touch') return; tip.style.display='none'; setHover(null); controls.autoRotate=true; });   // 指を離した時にも pointerleave が来て、タップした説明がすぐ閉じた（スマホ）。指の時は、別の所のタップで閉じる

const composer=new EffectComposer(renderer); composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.55,0.8); composer.addPass(bloom); composer.addPass(new OutputPass());
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); });

const loadingEl=document.getElementById('loading'); if(loadingEl) loadingEl.remove();
let t=0;
(function loop(){ requestAnimationFrame(loop); t+=0.01;
  particles.rotation.y=t*0.04; stepFlow(t*3); circuitTex.offset.x=t*0.03;
  controls.update(); composer.render(); labelRenderer.render(scene,camera);
})();
</script>
</body>
</html>
